name: Refresh weather and air quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/weather/**"
      - "backend/scripts/build_weather.py"
      - ".github/workflows/weather.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: weather-refresh
  cancel-in-progress: true

jobs:
  build-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight weather dependency
        run: pip install "httpx>=0.28"

      - name: Fetch weather and air quality
        env:
          PYTHONPATH: backend
        run: python backend/scripts/build_weather.py --out weather-data/weather.json

      - name: Save reusable weather data
        uses: actions/upload-artifact@v4
        with:
          name: weather-data
          path: weather-data/weather.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

