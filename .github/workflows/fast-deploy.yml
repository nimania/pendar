name: Fast Deploy Pendar UI
# Manual homepage refresh requested on 2026-10-22; retain scheduled and collector-triggered publication.
# Lightweight news + figures publication. Heavy catalog rebuilding is manual-only.
on:
  workflow_dispatch:
  schedule:
    # Rebuild the vetted homepage at :05 and :35 UTC; GitHub can delay schedules.
    - cron: "5,35 * * * *"
  workflow_run:
    workflows: ["Collect Pendar News (independent)", "Collect Pendar Figures (independent)", "Refresh weather and air quality", "Google Trends Iran Collector"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "web-static/**"
      - "backend/data/editorial-recaps.json"
      - ".github/workflows/fast-deploy.yml"
      - "backend/tests/test_editorial_report_ui.js"
      - "backend/tests/test_front_page_desk.js"
      - "backend/tests/test_home_feature_categories.js"
      - "backend/tests/test_home_pulse_and_thumbnails.js"
      - "backend/tests/test_trends_home_cards.py"
      - "backend/tests/test_story_shell_refresh.py"
      - "backend/scripts/refresh_story_shells.py"
      - "backend/scripts/refresh_figure_shells.py"
      - "backend/scripts/publish_story_permalinks.py"
      - "backend/tests/test_story_permalink_publishing.py"
      - "backend/tests/test_figure_shell_refresh.py"
      - "backend/scripts/prepare_priority_site.py"
      - "backend/scripts/verify_direct_routes.py"
      - "backend/scripts/publish_editorial_story_sitemap.py"
      - "backend/tests/test_editorial_story_sitemap.py"
      - "backend/tests/test_verify_direct_routes.py"
      - "backend/scripts/audit_pages_size.py"
      - "backend/scripts/build_iran_scenario_radar.py"
      - "backend/scripts/build_iran_scenario_pages.py"
      - "backend/scripts/publish_iran_radar_live.py"
      - "backend/scripts/configure_iran_radar_live.py"
      - "backend/scripts/restore_core_site_data.py"
      - "backend/scripts/validate_site_integrity.py"
      - "backend/scripts/trends_seo.py"
      - "backend/scripts/publish_google_trends.py"
      - "backend/scripts/publish_editorial_handles.py"
      - "backend/scripts/trends_magazine.py"
      - "backend/scripts/trends_media.py"
      - "backend/scripts/trends_topics.py"
      - "backend/scripts/trends_context.py"
      - "backend/scripts/trends_enrichment.py"
      - "backend/tests/test_trends_enrichment.py"
      - "backend/tests/test_trends_topics.py"
      - "backend/tests/test_google_trends_presentation.py"
      - "backend/tests/test_trends_home_cards.py"
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pendar-pages-fast
  cancel-in-progress: false
jobs:
  build-ui:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify core recovery contracts
        run: python -m unittest discover -s backend/tests -p test_core_site_recovery.py -v
      - name: Check editorial Python syntax before publication
        run: python -m py_compile backend/scripts/build_editorial_reports.py
      - name: Verify visible Pendar reports and source links
        run: node backend/tests/test_editorial_report_ui.js
      - name: Validate shared front-page editorial desks
        run: |
          node backend/tests/test_home_feature_categories.js
          node backend/tests/test_front_page_desk.js
          node backend/tests/test_home_pulse_and_thumbnails.js
          python -m unittest discover -s backend/tests -p test_trends_home_cards.py -v
      - name: Restore last verified published site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          restored=0
          # Do not assume that the most recent successful run still has its Pages artifact.
          mapfile -t page_runs < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/fast-deploy.yml/runs?status=success&per_page=15" --jq '.workflow_runs[].id' 2>/dev/null || true)
          for old_id in "${page_runs[@]}"; do
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$old_id/artifacts" --jq '[.artifacts[] | select(.expired==false and (.name|startswith("github-pages")))] | .[0].name // empty' 2>/dev/null || true)"
            [ -n "$artifact" ] || continue
            rm -rf site /tmp/base-pages && mkdir -p site /tmp/base-pages
            if gh run download "$old_id" -n "$artifact" -D /tmp/base-pages && [ -s /tmp/base-pages/artifact.tar ] && tar -xf /tmp/base-pages/artifact.tar -C site; then
              if [ -s site/index.html ] && [ -s site/data/figures.json ] && [ -s site/data/stories.json ]; then
                echo "Restored Pages snapshot from successful run $old_id"
                restored=1
                break
              fi
            fi
            echo "::warning::Pages artifact for run $old_id unavailable or incomplete."
          done
          if [ "$restored" -ne 1 ]; then
            # Recovery for installations where light Pages artifacts have expired.
            mapfile -t complete_runs < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?status=success&per_page=10" --jq '.workflow_runs[].id' 2>/dev/null || true)
            for old_id in "${complete_runs[@]}"; do
              rm -rf site && mkdir -p site
              if gh run download "$old_id" -n latest-static-site -D site && python backend/scripts/unpack_site_artifact.py site; then
                if [ -s site/index.html ] && [ -s site/data/figures.json ] && [ -s site/data/stories.json ]; then
                  echo "Restored complete-build site from run $old_id"
                  restored=1
                  break
                fi
              fi
            done
          fi
          if [ "$restored" -ne 1 ]; then
            # A build artifact can outlive the short run search window, and
            # the matching run can be absent from the first 10 results.
            # Enumerate retained artifacts repo-wide instead of guessing run IDs.
            mapfile -t recovery_artifacts < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false and .name=="latest-static-site") | .id' 2>/dev/null || true)
            echo "Retained complete-site artifacts available: ${#recovery_artifacts[@]}"
            for artifact_id in "${recovery_artifacts[@]}"; do
              rm -rf site /tmp/recovery-archive && mkdir -p site /tmp/recovery-archive
              if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/recovery-archive/artifact.zip \
                  && unzip -q /tmp/recovery-archive/artifact.zip -d /tmp/recovery-archive/extracted \
                  && cp -a /tmp/recovery-archive/extracted/. site/ \
                  && python backend/scripts/unpack_site_artifact.py site \
                  && [ -s site/index.html ] && [ -s site/data/figures.json ] && [ -s site/data/stories.json ]; then
                echo "Restored complete-site snapshot from retained artifact ${artifact_id}"
                restored=1
                break
              fi
              echo "::warning::Retained artifact ${artifact_id} could not restore verified core."
            done
          fi
          if [ "$restored" -ne 1 ]; then
            echo "::error::No verified published site snapshot available; preserving the current live site."
            exit 1
          fi
      - name: Recover missing core data from the last complete build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python backend/scripts/restore_core_site_data.py --site site --check; then
            echo "Core data already present; no recovery download needed."
          else
            complete_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
            test -n "$complete_id" || { echo "::error::No successful complete build for recovery"; exit 1; }
            mkdir -p /tmp/core-recovery
            gh run download "$complete_id" -n latest-static-site -D /tmp/core-recovery
            python backend/scripts/restore_core_site_data.py --site site --archive /tmp/core-recovery/latest-static-site.tar
          fi

      - name: Overlay freshest independently collected news
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          news_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/news-refresh.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -z "$news_run" ]; then
            echo "::warning::No successful standalone news collection; retaining last healthy news."
            exit 0
          fi
          rm -rf /tmp/new-news && mkdir -p /tmp/new-news
          if ! gh run download "$news_run" -n pendar-news-data -D /tmp/new-news; then
            echo "::warning::News artifact missing; retaining healthy news."
            exit 0
          fi
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path("/tmp/new-news/data")
          dst=Path("site/data")
          fresh=json.loads((src/"meta.json").read_text(encoding="utf-8"))
          old=json.loads((dst/"meta.json").read_text(encoding="utf-8")) if (dst/"meta.json").exists() else {}
          def stamp(meta):
              value=str(meta.get("built_iso") or "")
              try: return datetime.fromisoformat(value.replace("Z","+00:00")).astimezone(timezone.utc)
              except ValueError: return datetime.min.replace(tzinfo=timezone.utc)
          assert stamp(fresh)>datetime.min.replace(tzinfo=timezone.utc)
          def complete(cards, folder):
              return bool(cards) and all(
                  isinstance(row,dict) and row.get("id") and
                  (folder/"story"/(str(row["id"])+".json")).is_file()
                  for row in cards
              )
          candidate=json.loads((src/"stories.json").read_text(encoding="utf-8"))
          current=json.loads((dst/"stories.json").read_text(encoding="utf-8")) if (dst/"stories.json").exists() else []
          assert complete(candidate,src), "Independent news payload has missing detail files"
          if stamp(fresh)<=stamp(old) and complete(current,dst):
              print("Keeping existing newer/equal news snapshot with complete details")
              raise SystemExit(0)
          if stamp(fresh)<=stamp(old):
              print("::warning::Repairing incomplete published news using last complete independent snapshot")
          stories=json.loads((src/"stories.json").read_text(encoding="utf-8"))
          previous=json.loads((dst/"stories.json").read_text(encoding="utf-8")) if (dst/"stories.json").exists() else []
          assert 1 <= len(stories) <= 60 and len(stories)>=len(previous)*0.8, "News integrity guard: homepage feed empty or dropped"
          import shutil
          dst.mkdir(parents=True,exist_ok=True)
          for name in ("stories.json","topics.json","entities.json","trends.json","stats.json","meta.json","press-stats.json","press-source-stories.json","press-source-health.json","press-source-repair-queue.json","factchecks.json","geo.json","news-health.json"):
              shutil.copy2(src/name,dst/name)
          if (src/"story").is_dir():
              shutil.copytree(src/"story",dst/"story",dirs_exist_ok=True)
          print(f"Overlaid independently collected news: {len(stories)} stories; {fresh['built_iso']}")
          PY


      - name: Overlay verified independently collected figures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          figure_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/figures-refresh.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -n "$figure_run" ]; then
            rm -rf /tmp/new-figures && mkdir -p /tmp/new-figures
            if gh run download "$figure_run" -n pendar-figures-data -D /tmp/new-figures; then
              python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('/tmp/new-figures/data')
          dst=Path('site/data')
          try:
              new=json.loads((src/'figures.json').read_text(encoding='utf-8'))
              old=json.loads((dst/'figures.json').read_text(encoding='utf-8')) if (dst/'figures.json').exists() else {}
              newer=str(new.get('generated_at') or '') > str(old.get('generated_at') or '')
              def latest(snapshot):
                  return max((str(p.get('published_at') or '') for f in snapshot.get('figures',[]) for p in f.get('posts',[])), default='')
              def size(snapshot):
                  return sum(len(f.get('posts',[])) for f in snapshot.get('figures',[]))
              substantive = latest(new)>latest(old) or (len(new.get('figures',[]))>=len(old.get('figures',[])) and size(new)>=size(old))
              if len(new.get('figures',[]))>=100 and newer and substantive:
                  dst.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(src/'figures.json',dst/'figures.json')
                  print('Published independently refreshed figures:',len(new['figures']))
              else:
                  print('Kept existing figure data: no newer statements or candidate below validation threshold.')
              if len(new.get('figures',[]))>=100 and (src/'figures-health.json').is_file():
                  shutil.copy2(src/'figures-health.json',dst/'figures-health.json')
          except (OSError,ValueError,KeyError) as e:
              print('::warning::Figure overlay skipped:',e)
          PY
            fi
          fi


      - name: Restore reviewed editorial recaps to published figures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          figures_path=Path('site/data/figures.json')
          editorial_path=Path('backend/data/editorial-recaps.json')
          if not figures_path.is_file() or not editorial_path.is_file():
              raise SystemExit('Missing figures or editorial recap input')
          data=json.loads(figures_path.read_text(encoding='utf-8'))
          recaps=json.loads(editorial_path.read_text(encoding='utf-8'))
          figures=data.get('figures',[])
          by_handle={str(f.get('handle','')).lower():f for f in figures}
          merged=0
          for entry in recaps:
              if not entry.get('id') or not str(entry.get('recap_fa') or '').strip():
                  continue
              for profile in entry.get('profiles',[]):
                  handle=str(profile.get('handle','')).lower()
                  if handle and handle not in by_handle:
                      new=profile.copy()
                      new.setdefault('posts',[])
                      figures.append(new)
                      by_handle[handle]=new
              for handle in entry.get('handles',[]):
                  figure=by_handle.get(str(handle).lower())
                  if not figure:
                      continue
                  post={k:v for k,v in entry.items() if k not in ('handles','profiles')}
                  post.update(handle=figure['handle'],avatar=figure.get('avatar',''),
                              role_fa=entry.get('source_name','گفت‌وگو'),
                              published_at=entry.get('published_at') or entry.get('recorded_at'))
                  posts=figure.setdefault('posts',[])
                  posts[:]=[p for p in posts if str(p.get('id'))!=str(entry['id'])]
                  posts.insert(0,post)
                  merged+=1
          figures_path.write_text(json.dumps(data,ensure_ascii=False),encoding='utf-8')
          print(f'Restored {merged} editorial recap placements in published figure data')
          assert merged>0, 'No reviewed editorial recaps matched published figures'
          PY

      - name: Overlay independently collected weather when newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          weather_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/weather.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -z "$weather_run" ]; then
            echo "::warning::No successful weather collection; retaining published data."
            exit 0
          fi
          mkdir -p /tmp/fresh-weather
          if ! gh run download "$weather_run" -n weather-data -D /tmp/fresh-weather; then
            echo "::warning::Weather artifact unavailable; retaining published data."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          new_path = Path("/tmp/fresh-weather/weather.json")
          target = Path("site/data/weather.json")
          if not new_path.is_file():
              print("::warning::No weather.json in artifact; preserving published weather")
              raise SystemExit(0)
          new = json.loads(new_path.read_text(encoding="utf-8"))
          if not isinstance(new, (dict, list)) or not new:
              raise SystemExit("::error::Weather artifact is empty or invalid")
          if target.is_file():
              old = json.loads(target.read_text(encoding="utf-8"))
              if old == new:
                  print("Weather data unchanged; keeping existing snapshot")
                  raise SystemExit(0)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(new_path.read_bytes())
          print("Weather data overlaid without rebuilding the site")
          PY

      - name: Overlay current UI without overwriting generated data
        run: |
          # Generated datasets (especially Jan-e Jaraid) belong to collector/build
          # artifacts. A UI hotfix must never replace them with seeded repo data.
          rsync -a --exclude 'data/' web-static/ site/
          mkdir -p site/data
          cp web-static/data/pendar-*.json site/data/
          cp web-static/data/us-radar.json site/data/us-radar.json
          # Validate and overlay Recipe Lab only. Fail open for unrelated Pendar sections.
          python - <<'PY_RECIPE_LAB'
          import json, shutil
          from pathlib import Path
          src=Path("web-static/data/recipe-lab-public.json")
          dst=Path("site/data/recipe-lab-public.json")
          try:
              data=json.loads(src.read_text(encoding="utf-8"))
              sources=data["sources"]
              recipes=data["recipes"]
              if not isinstance(sources,list) or not isinstance(recipes,list) or not sources or not recipes:
                  raise ValueError("catalog requires nonempty source and recipe lists")
              ids=[x["id"] for x in sources]
              if len(ids)!=len(set(ids)):
                  raise ValueError("duplicate source ids")
              names=[x["name"] for x in recipes]
              if len(names)!=len(set(names)):
                  raise ValueError("duplicate recipe names")
              for i,r in enumerate(recipes):
                  if not isinstance(r.get("ingredients"),list) or not r["ingredients"] or not r.get("method"):
                      raise ValueError(f"incomplete recipe at index {i}")
                  if r.get("source") not in ids:
                      raise ValueError(f"unknown source on recipe {i}")
              if dst.exists():
                  try:
                      prev=json.loads(dst.read_text(encoding="utf-8"))
                      if len(recipes)<len(prev.get("recipes",[])):
                          raise ValueError("recipe count regression vs previous deployed dataset")
                  except json.JSONDecodeError:
                      pass
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              print(f"Recipe Lab validated and overlaid: {len(sources)} sources, {len(recipes)} research records")
          except (OSError, ValueError, TypeError, KeyError) as exc:
              print(f"::warning::Recipe Lab update skipped ({exc}); other sections continue")
          PY_RECIPE_LAB
          cp web-static/data/future-*.json site/data/
          test -s site/data/press-directory.js || cp web-static/data/press-directory.js site/data/press-directory.js
          cp web-static/data/book-{curation,directory,places}.json site/data/
          # Never let the empty repository seed overwrite a previously healthy
          # Guide when the live EPG refresh failed.
          if [ -s /tmp/tv-guide.json ]; then
            cp /tmp/tv-guide.json site/data/tv-guide.json
          else
            echo "::warning::Fresh TV Guide unavailable; preserving downloaded healthy site data."
          fi
          python - <<'PY'
          import hashlib, pathlib, re
          root = pathlib.Path("site")
          versions = {}
          for name in ("market-nabzesh.js", "market-weather.js", "feed.js", "diner.js", "diner.css", "radar-live.js", "us-radar.js", "israel-radar.js", "israel-radar.css", "meshki-series.js", "home.js", "home-polish.css", "event-trends.js", "content-discovery.js", "story-detail.js", "secondary-views.js", "series-showcase.js", "app.js", "core.js", "router.js", "entities.js", "loaders.js", "figures-core.js", "figures-profile.js", "search.js", "book-app.js", "styles.css", "books-hub.js", "books-hub.css", "book-curation.js", "book-directory.js", "book-market-ui.js", "book-places.js", "book-radar-ui.js", "book-radar-data.js", "iran-provinces.js", "data/press-directory.js", "data/books.js", "movies-hub.js", "movies-hub.css", "movies-data.js", "data/movies.js", "tv-guide.js", "tv-guide.css", "knowledge-hub.js"):
              p = root / name
              if p.exists():
                  versions[name] = hashlib.md5(p.read_bytes()).hexdigest()[:8]
          # Retained deep-link pages must load the same fresh modules as home.
          for idx in root.rglob("*.html"):
              text = idx.read_text(encoding="utf-8")
              for name, version in versions.items():
                  text = re.sub(
                      r'((?:src|href)="' + re.escape(name) + r')(?:\?v=[0-9a-f]+)?(")',
                      r'\1?v=' + version + r'\2',
                      text,
                  )
              idx.write_text(text, encoding="utf-8")
          sw = root / "sw.js"
          if sw.exists() and versions:
              bundle_v = hashlib.md5(
                  "|".join(f"{k}:{versions[k]}" for k in sorted(versions)).encode("utf-8")
              ).hexdigest()[:10]
              s = sw.read_text(encoding="utf-8")
              s = re.sub(r'const V = "[^"]*";', f'const V = "pendar-{bundle_v}";', s, count=1)
              sw.write_text(s, encoding="utf-8")
          PY

      - name: Ensure direct news links have static entry pages
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path("site")
          stories=json.loads((root/"data/stories.json").read_text(encoding="utf-8"))
          shell=root/"index.html"
          made=0
          for story in stories:
              sid=str(story.get("id",""))
              if not sid or not (root/"data/story"/(sid+".json")).is_file():
                  raise SystemExit("::error::Missing story data for "+sid)
              dest=root/"story"/sid/"index.html"
              if not dest.exists():
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(shell,dest)
                  made+=1
          # Event dossier IDs are anchored to story UUIDs; create direct route entry
          # files for all retained story details, including older event anchors.
          import re
          ids=[p.stem for p in (root/"data/story").glob("*.json")
               if re.fullmatch(r"[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}",p.stem)]
          # Include previously shared event URLs, even if the anchor story aged
          # out of the latest compact feed. The SPA will offer an archive fallback.
          ids=sorted(set(ids+["9883cb58-e3da-4f35-8684-3ec9a6b70a37"]))
          for sid in ids:
              dest=root/"event"/("event-"+sid)/"index.html"
              if not dest.is_file():
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(shell,dest)
          # Make all seven AI editorial profile URLs directly shareable. These
          # slots use role titles until editorial pseudonyms are approved.
          author_data=json.loads((root/"data/pendar-editorial-authors.json").read_text(encoding="utf-8"))
          author_ids=[a["id"] for a in author_data.get("authors",[])]+["desk"]
          assert len(author_ids)==8 and len(set(author_ids))==8
          for author_id in author_ids:
              assert re.fullmatch(r"[a-z][a-z0-9-]{2,45}",author_id)
              dest=root/"editorial-author"/author_id/"index.html"
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(shell,dest)
          # Discoverable central reports archive; preserve the same SPA shell.
          reports_dir=root/"reports"
          reports_dir.mkdir(parents=True,exist_ok=True)
          shutil.copy2(shell,reports_dir/"index.html")
          # Historic /fa/ and /en/ serial-news URLs are no longer Pendar content.
          # Keep a true GitHub Pages 404 fallback instead of showing the SPA
          # homepage (a misleading soft-404-like response for retired URLs).
          not_found=pathlib.Path("web-static/404.html")
          if not not_found.is_file():
              raise SystemExit("::error::Dedicated 404.html missing")
          error_html=not_found.read_text(encoding="utf-8")
          if '<meta name="robots" content="noindex,follow">' not in error_html or '<h1>این صفحه پیدا نشد</h1>' not in error_html:
              raise SystemExit("::error::Dedicated 404.html lacks the required removed-content contract")
          shutil.copy2(not_found,root/"404.html")
          assert (root/"event"/"event-9883cb58-e3da-4f35-8684-3ec9a6b70a37"/"index.html").is_file()
          assert (root/"404.html").is_file()
          print("Ensured",len(stories),"news entry pages; newly created",made,
                "; event dossiers",len(ids),flush=True)
          PY
      - name: Refresh cached article UI while keeping prerendered SEO
        run: |
          python -m unittest discover -s backend/tests -p test_story_shell_refresh.py -v
          python backend/scripts/refresh_story_shells.py --site site
      - name: Refresh figures magazine on direct person routes with preserved SEO
        run: |
          python -m unittest discover -s backend/tests -p test_figure_shell_refresh.py -v
          python backend/scripts/refresh_figure_shells.py --site site
      - name: Publish readable, stable story permalinks and preserve old UUID URLs
        run: |
          python -m unittest discover -s backend/tests -p test_story_permalink_publishing.py -v
          python backend/scripts/publish_story_permalinks.py --site site --limit 60
      - name: Advertise recent verified story URLs to Google via dedicated sitemap
        run: python backend/scripts/publish_fast_story_sitemap.py --site site --limit 100
      - name: Restore cached book shelf entry only (no collectors)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("site")
          cached=root/"books-data.js"
          if not cached.is_file() or cached.stat().st_size<1000 or cached.stat().st_size>2000000:
              print("::warning::Cached book data unavailable or over 2MB; skipping book shelf activation.")
          else:
              target=root/"books"/"index.html"
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(root/"index.html",target)
              assert target.is_file()
              print(f"Cached book shelf entry enabled; data bytes={cached.stat().st_size}; zero new API calls")
          PY
      - name: Restore cached film and television entrances independently (no API refresh)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('site')
          shell=root/'index.html'
          checks={
              'movies': ('movies-hub.js','movies-data.js'),
              'tv': ('tv-guide.js',),
          }
          for section,files in checks.items():
              available=any((root/name).is_file() and (root/name).stat().st_size>1000 for name in files)
              if not available:
                  print(f'::warning::No existing {section} UI module; skip entrance.')
                  continue
              dest=root/section/'index.html'
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(shell,dest)
              print(f'Restored {section} entrance using existing UI only; no new API calls.')
          PY
      - name: Restore cached press directory only (no RSS or PDF collection)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json
          root=Path("site")
          static_manifest=root/"data/press-directory.js"
          if not static_manifest.is_file():
              print("::warning::Press source directory unavailable; skip press entry.")
          else:
              dest=root/"press"/"index.html"
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(root/"index.html",dest)
              archive=root/"data/periodicals.json"
              if archive.is_file() and archive.stat().st_size<=5000000:
                  try:
                      data=json.loads(archive.read_text(encoding="utf-8"))
                      rows=data if isinstance(data,list) else data.get("articles",[])
                      print("Cached press entries:",len(rows))
                  except (ValueError,OSError) as e:
                      print("::warning::Cached press archive invalid:",e)
              else:
                  print("::warning::Press archive not present; directory-only mode, no fetching.")
              print("Press directory entrance restored; no RSS/PDF calls.")
          PY
      - name: Restore static future research pages (no AI processing)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('site')
          if not (root/'future.js').is_file():
              print('::warning::Future UI unavailable; skipping static entry.')
          else:
              for route in ('future','future/method','future/transition',
                            'future/transition/watch','future/transition/fattahi'):
                  target=root/route/'index.html'
                  target.parent.mkdir(parents=True,exist_ok=True)
                  if not target.is_file():
                      shutil.copy2(root/'index.html',target)
              print('Static future routes restored; no AI jobs or source collection.')
          PY
      - name: Publish three lightweight entity handles
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("site")
          shell=root/"index.html"
          handles=("irna","isna","filimo","mehr-news","fars-news","khabaronline","radio-farda","bbc-persian","iran-international","euronews-persian","kayhan-london","independent-persian","radio-zamaneh","florian-henckel-von-donnersmarck","ulrich-muhe","martina-gedeck","sebastian-koch","asghar-farhadi","peyman-maadi","leila-hatami","sareh-bayat","shahab-hosseini")
          # Existing figure handles have precedence. Do not overwrite their pages.
          for slug in handles:
              target=root/("@"+slug)/"index.html"
              if target.exists():
                  print("::warning::Existing identity retains @"+slug)
                  continue
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(shell,target)
          print("Non-person handle pilot: thirteen static paths, no new API requests")
          PY
      - name: Build compact radar client data
        run: python backend/scripts/build_radar_view_data.py --site site
      - name: Extend and score Iran scenarios from published Pendar data
        continue-on-error: true
        run: python backend/scripts/build_iran_scenario_radar.py --site site
      - name: Publish linkable Iran scenario families and subscenarios
        run: python backend/scripts/build_iran_scenario_pages.py --site site
      - name: Verify nested scenario page contracts
        run: |
          python -m py_compile backend/scripts/build_iran_scenario_pages.py
          python -m unittest discover -s backend/tests -p 'test_iran_scenario_pages.py' -v
      - name: Install optional live radar browser configuration
        env:
          RADAR_LIVE_ORIGIN: ${{ vars.RADAR_LIVE_ORIGIN }}
        run: python backend/scripts/configure_iran_radar_live.py --site site
      - name: Send verified-source scenario signals to optional live edge
        continue-on-error: true
        env:
          RADAR_LIVE_ORIGIN: ${{ vars.RADAR_LIVE_ORIGIN }}
          RADAR_LIVE_INGEST_TOKEN: ${{ secrets.RADAR_LIVE_INGEST_TOKEN }}
        run: python backend/scripts/publish_iran_radar_live.py --site site
      - name: Ensure direct entry pages and verify navigation contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("site")
          shell=root/"index.html"
          assert shell.is_file()
          for route in ("headlines","figures","books","movies","press","diner","future","reports"):
              target=root/route/"index.html"
              if not target.is_file():
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(shell,target)
          PY
          python backend/scripts/publish_editorial_handles.py --site site
          # Route validation requires the destination manifest; final publication refreshes it again.
          python backend/scripts/publish_jankalam_news.py --site site
          python -m unittest discover -s backend/tests -p test_verify_direct_routes.py -v
          python backend/scripts/verify_direct_routes.py site
      - name: Install optional video compressor for Pages artifact
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if timeout 90s sudo apt-get update -qq && timeout 90s sudo apt-get install -y -qq ffmpeg; then
              echo "ffmpeg installed"
            else
              echo "::warning::ffmpeg unavailable; optional video compression will be skipped"
            fi
          fi
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            echo "ffmpeg not available; continuing without video compression"
          fi
      - name: Optimize large Diner videos in deployment copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('site/assets/diner')
          for name in ('overhead-pizza.mp4','foodcost-pizza.mp4'):
              source=root/name
              if not source.is_file():
                  print('Optional video absent:',name)
                  continue
              before=source.stat().st_size
              if before<5_000_000:
                  continue
              output=source.with_name(source.stem+'.optimized.mp4')
              try:
                  subprocess.run([
                      'ffmpeg','-hide_banner','-loglevel','error','-nostdin','-y',
                      '-i',str(source),'-map','0:v:0','-map','0:a?',
                      '-c:v','libx264','-preset','veryfast','-crf','31',
                      '-pix_fmt','yuv420p','-c:a','aac','-b:a','96k',
                      '-movflags','+faststart',str(output)
                  ],check=True,timeout=150)
                  subprocess.run(['ffprobe','-v','error','-select_streams','v:0',
                                  '-show_entries','stream=codec_name','-of','default=noprint_wrappers=1',
                                  str(output)],check=True,stdout=subprocess.DEVNULL,timeout=10)
                  after=output.stat().st_size
                  if 0<after<before*0.85:
                      output.replace(source)
                      print(f'Optimized {name}: {before:,} -> {after:,} bytes')
                  else:
                      print(f'Kept original {name}: compression insufficient ({before:,} -> {after:,})')
              except (OSError,subprocess.SubprocessError) as exc:
                  print(f'::warning::Video optimization skipped for {name}: {exc}')
              finally:
                  output.unlink(missing_ok=True)
          PY
      - name: Preserve validated lightweight news and figures only
        run: |
          python backend/scripts/prepare_priority_site.py site
          python backend/scripts/validate_site_integrity.py --site site
          # 780 MB staging ceiling remains well below the GitHub Pages 1 GB site limit.
          # Previous 750 MB ceiling blocked a validated 752.4 MB build.
          python backend/scripts/audit_pages_size.py site 780000000
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('site/data')
          figures=json.loads((root/'figures.json').read_text(encoding='utf-8'))
          stories=json.loads((root/'stories.json').read_text(encoding='utf-8'))
          assert len(figures.get('figures',[])) >= 100, 'Figure corpus unexpectedly small'
          assert 1 <= len(stories) <= 60, 'News headline feed invalid'
          missing=[str(row.get('id')) for row in stories if isinstance(row,dict) and row.get('id') and not (root/'story'/(str(row['id'])+'.json')).is_file()]
          if missing:
              raise SystemExit('::error::Missing story detail JSON for published headlines: '+', '.join(missing[:8]))
          print('Fast publish validated:',len(stories),'headlines and',len(figures['figures']),'figures; all story details available')
          PY
      - name: Remove retired Badbadak assets and retain only its redirect
        run: |
          rm -f site/badbadak.js site/badbadak.css site/assets/badbadak-header.png site/assets/badbadak-logo.png
          rm -rf site/badbadak
          mkdir -p site/badbadak
          cp web-static/badbadak/index.html site/badbadak/index.html
          python backend/scripts/audit_pages_size.py site 780000000
      - name: Freeze the half-hour homepage editorial snapshot
        run: python backend/scripts/freeze_homepage_snapshot.py --site site
      - name: Check image and SEO publishing regressions
        run: |
          python -m pip install --disable-pip-version-check -q 'Pillow>=11,<13'
          python -m py_compile backend/scripts/trends_seo.py backend/scripts/trends_magazine.py backend/scripts/trends_media.py backend/scripts/trends_topics.py backend/scripts/trends_context.py backend/scripts/trends_enrichment.py backend/scripts/publish_google_trends.py
          node --check web-static/heritage-preview.js
          node --check web-static/heritage-live.js
          node --check web-static/trends-interactions.js
          node --check web-static/figures-profile.js
          python -m unittest discover -s backend/tests -p test_google_trends_presentation.py -v
          python -m unittest discover -s backend/tests -p test_trends_topics.py -v
          python -m unittest discover -s backend/tests -p test_trends_enrichment.py -v
          python -m unittest discover -s backend/tests -p test_trends_home_cards.py -v
      - name: Overlay verified Google Trends briefings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PENDAR_TRENDS_MEDIA: "1"
        run: |
          trend_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/google-trends-iran.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -z "$trend_run" ]; then
            echo "::warning::No successful Google Trends collection yet."
          else
            mkdir -p /tmp/trends
            if gh run download "$trend_run" -n pendar-google-trends-data -D /tmp/trends; then
              python backend/scripts/publish_google_trends.py --site site --data /tmp/trends/data/google-trends-iran.json
            else
              echo "::warning::Google Trends artifact missing; retaining existing snapshot."
            fi
          fi
      - name: Stamp actual published build time
        run: |
          python - <<'PY'
          import datetime,json,pathlib
          target=pathlib.Path('site/data/footer-status.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps({
            "published_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "source":"fast-deploy"
          }),encoding='utf-8')
          PY
      - name: Report published figure freshness
        run: |
          python - <<'PY'
          import json,datetime,pathlib
          root=pathlib.Path("site/data")
          d=json.loads((root/"figures.json").read_text(encoding="utf-8"))
          now=datetime.datetime.now(datetime.timezone.utc)
          dates=[]
          for figure in d.get("figures",[]):
              for post in figure.get("posts",[]):
                  try:
                      dt=datetime.datetime.fromisoformat(str(post.get("published_at","")).replace("Z","+00:00"))
                      if dt.tzinfo is None:dt=dt.replace(tzinfo=datetime.timezone.utc)
                      dates.append(dt.astimezone(datetime.timezone.utc))
                  except ValueError:pass
          recent=sum(now-datetime.timedelta(hours=24)<=t<=now for t in dates)
          last=max(dates).isoformat() if dates else "none"
          print(f"Published figures: {len(d.get('figures',[]))}; valid statements: {len(dates)}; 24h: {recent}; latest: {last}; generated_at: {d.get('generated_at','missing')}",flush=True)
          if not dates:raise SystemExit("::error::No dated figure statements in publish payload")
          PY
      - name: Guarantee standalone Radar daily article survives final site assembly
        run: |
          set -euo pipefail
          source="web-static/reports/daily/2026-10-24/military-threat-and-diplomacy/index.html"
          target="site/reports/daily/2026-10-24/military-threat-and-diplomacy/index.html"
          test -s "$source"
          mkdir -p "$(dirname "$target")"
          cp "$source" "$target"
          python - <<'PY'
          from pathlib import Path
          p = Path("site/reports/daily/2026-10-24/military-threat-and-diplomacy/index.html")
          text = p.read_text(encoding="utf-8")
          assert "نیما افشارنادری" in text
          assert "تهدید حمله" in text
          assert "<article" in text or "<p>" in text
          print("Standalone Radar article verified:", p, len(text), "bytes")
          PY
      - name: Verify IranSignal hub and daily report in publication payload
        run: |
          set -euo pipefail
          for path in iransignal/index.html iransignal/daily/index.html iransignal/weekly/index.html iransignal/daily/2026-10-24/military-threat-and-diplomacy/index.html; do
            test -s "web-static/$path"
            mkdir -p "site/$(dirname "$path")"
            cp "web-static/$path" "site/$path"
            test -s "site/$path"
          done
          grep -q 'نیما افشارنادری' site/iransignal/daily/2026-10-24/military-threat-and-diplomacy/index.html
          echo "IranSignal hub, daily archive, weekly archive and first report verified in Pages payload."
      - name: Publish Jan Kalam news archive and preserve Pendar authored reports
        run: |
          python -m unittest discover -s backend/tests -p test_jankalam_news_migration.py -v
          node backend/tests/test_jankalam_news_routes.js
          python backend/scripts/publish_jankalam_news.py --site site
      - name: Publish verified authored story sitemap
        run: |
          python -m unittest discover -s backend/tests -p test_editorial_story_sitemap.py -v
          python backend/scripts/publish_editorial_story_sitemap.py --site site
      - name: Upload light Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
  deploy:
    needs: build-ui
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy news and figures to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
