name: Fast Deploy Pendar UI
# Lightweight news + figures publication. Heavy catalog rebuilding is manual-only.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect Pendar News (independent)", "Collect Pendar Figures (independent)"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "web-static/**"
      - ".github/workflows/fast-deploy.yml"
      - "backend/scripts/prepare_priority_site.py"
      - "backend/scripts/audit_pages_size.py"
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pendar-pages-fast
  cancel-in-progress: false
jobs:
  build-ui:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore last successful light Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          old_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/fast-deploy.yml/runs?status=success&per_page=10" --jq '[.workflow_runs[] | select(.id != '${GITHUB_RUN_ID}')][0].id // empty')"
          if [ -z "$old_id" ]; then
            echo "::error::No previously successful light Pages artifact. Use a verified recovery build."
            exit 1
          fi
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$old_id/artifacts" --jq '[.artifacts[] | select(.expired==false and (.name|startswith("github-pages")))] | .[0].name // empty')"
          test -n "$artifact" || { echo "::error::No existing Pages artifact found"; exit 1; }
          mkdir -p /tmp/base-pages
          gh run download "$old_id" -n "$artifact" -D /tmp/base-pages
          test -s /tmp/base-pages/artifact.tar
          tar -xf /tmp/base-pages/artifact.tar -C site
          test -s site/index.html
          test -s site/data/figures.json
          test -s site/data/stories.json

      - name: Overlay freshest independently collected news
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          news_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/news-refresh.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -z "$news_run" ]; then
            echo "::warning::No successful standalone news collection; retaining last healthy news."
            exit 0
          fi
          rm -rf /tmp/new-news && mkdir -p /tmp/new-news
          if ! gh run download "$news_run" -n pendar-news-data -D /tmp/new-news; then
            echo "::warning::News artifact missing; retaining healthy news."
            exit 0
          fi
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path("/tmp/new-news/data")
          dst=Path("site/data")
          fresh=json.loads((src/"meta.json").read_text(encoding="utf-8"))
          old=json.loads((dst/"meta.json").read_text(encoding="utf-8")) if (dst/"meta.json").exists() else {}
          def stamp(meta):
              value=str(meta.get("built_iso") or "")
              try: return datetime.fromisoformat(value.replace("Z","+00:00")).astimezone(timezone.utc)
              except ValueError: return datetime.min.replace(tzinfo=timezone.utc)
          assert stamp(fresh)>datetime.min.replace(tzinfo=timezone.utc)
          def complete(cards, folder):
              return bool(cards) and all(
                  isinstance(row,dict) and row.get("id") and
                  (folder/"story"/(str(row["id"])+".json")).is_file()
                  for row in cards
              )
          candidate=json.loads((src/"stories.json").read_text(encoding="utf-8"))
          current=json.loads((dst/"stories.json").read_text(encoding="utf-8")) if (dst/"stories.json").exists() else []
          assert complete(candidate,src), "Independent news payload has missing detail files"
          if stamp(fresh)<=stamp(old) and complete(current,dst):
              print("Keeping existing newer/equal news snapshot with complete details")
              raise SystemExit(0)
          if stamp(fresh)<=stamp(old):
              print("::warning::Repairing incomplete published news using last complete independent snapshot")
          stories=json.loads((src/"stories.json").read_text(encoding="utf-8"))
          previous=json.loads((dst/"stories.json").read_text(encoding="utf-8")) if (dst/"stories.json").exists() else []
          assert 1 <= len(stories) <= 60 and len(stories)>=len(previous)*0.8, "News integrity guard: homepage feed empty or dropped"
          import shutil
          dst.mkdir(parents=True,exist_ok=True)
          for name in ("stories.json","topics.json","entities.json","trends.json","stats.json","meta.json","press-stats.json","press-source-stories.json","press-source-health.json","press-source-repair-queue.json","factchecks.json","geo.json","news-health.json"):
              shutil.copy2(src/name,dst/name)
          if (src/"story").is_dir():
              shutil.copytree(src/"story",dst/"story",dirs_exist_ok=True)
          print(f"Overlaid independently collected news: {len(stories)} stories; {fresh['built_iso']}")
          PY


      - name: Overlay verified independently collected figures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          figure_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/figures-refresh.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [ -n "$figure_run" ]; then
            rm -rf /tmp/new-figures && mkdir -p /tmp/new-figures
            if gh run download "$figure_run" -n pendar-figures-data -D /tmp/new-figures; then
              python - <<'PY'
          import json,shutil
          from pathlib import Path
          src=Path('/tmp/new-figures/data')
          dst=Path('site/data')
          try:
              new=json.loads((src/'figures.json').read_text(encoding='utf-8'))
              old=json.loads((dst/'figures.json').read_text(encoding='utf-8')) if (dst/'figures.json').exists() else {}
              newer=str(new.get('generated_at') or '') > str(old.get('generated_at') or '')
              if len(new.get('figures',[]))>=100 and newer:
                  dst.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(src/'figures.json',dst/'figures.json')
                  shutil.copy2(src/'figures-health.json',dst/'figures-health.json')
                  print('Published independently refreshed figures:',len(new['figures']))
              else:
                  print('Kept existing figure data: candidate not newer or below validation threshold.')
          except (OSError,ValueError,KeyError) as e:
              print('::warning::Figure overlay skipped:',e)
          PY
            fi
          fi


      - name: Overlay current UI without overwriting generated data
        run: |
          # Generated datasets (especially Jan-e Jaraid) belong to collector/build
          # artifacts. A UI hotfix must never replace them with seeded repo data.
          rsync -a --exclude 'data/' web-static/ site/
          mkdir -p site/data
          cp web-static/data/pendar-*.json site/data/
          cp web-static/data/us-radar.json site/data/us-radar.json
          cp web-static/data/future-*.json site/data/
          # Never let the empty repository seed overwrite a previously healthy
          # Guide when the live EPG refresh failed.
          if [ -s /tmp/tv-guide.json ]; then
            cp /tmp/tv-guide.json site/data/tv-guide.json
          else
            echo "::warning::Fresh TV Guide unavailable; preserving downloaded healthy site data."
          fi
          python - <<'PY'
          import hashlib, pathlib, re
          root = pathlib.Path("site")
          versions = {}
          for name in ("market-nabzesh.js", "market-weather.js", "feed.js", "diner.js", "diner.css", "radar-live.js", "us-radar.js", "israel-radar.js", "israel-radar.css", "meshki-series.js", "home.js", "home-polish.css", "event-trends.js", "content-discovery.js", "story-detail.js", "secondary-views.js", "series-showcase.js", "app.js", "router.js", "entities.js", "loaders.js", "figures-core.js", "figures-profile.js", "search.js", "book-app.js", "styles.css", "books-hub.js", "books-hub.css", "book-curation.js", "book-directory.js", "book-market-ui.js", "book-places.js", "book-radar-ui.js", "book-radar-data.js", "iran-provinces.js", "data/press-directory.js", "data/books.js", "movies-hub.js", "movies-hub.css", "movies-data.js", "data/movies.js", "tv-guide.js", "tv-guide.css", "knowledge-hub.js"):
              p = root / name
              if p.exists():
                  versions[name] = hashlib.md5(p.read_bytes()).hexdigest()[:8]
          idx = root / "index.html"
          text = idx.read_text(encoding="utf-8")
          for name, version in versions.items():
              text = re.sub(
                  r'((?:src|href)="' + re.escape(name) + r')(?:\?v=[0-9a-f]+)?(")',
                  r'\1?v=' + version + r'\2',
                  text,
              )
          idx.write_text(text, encoding="utf-8")
          sw = root / "sw.js"
          if sw.exists() and versions:
              bundle_v = hashlib.md5(
                  "|".join(f"{k}:{versions[k]}" for k in sorted(versions)).encode("utf-8")
              ).hexdigest()[:10]
              s = sw.read_text(encoding="utf-8")
              s = re.sub(r'const V = "[^"]*";', f'const V = "pendar-{bundle_v}";', s, count=1)
              sw.write_text(s, encoding="utf-8")
          PY

      - name: Ensure direct news links have static entry pages
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path("site")
          stories=json.loads((root/"data/stories.json").read_text(encoding="utf-8"))
          shell=root/"index.html"
          made=0
          for story in stories:
              sid=str(story.get("id",""))
              if not sid or not (root/"data/story"/(sid+".json")).is_file():
                  raise SystemExit("::error::Missing story data for "+sid)
              dest=root/"story"/sid/"index.html"
              if not dest.exists():
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(shell,dest)
                  made+=1
          # Event dossier IDs are anchored to story UUIDs; create direct route entry
          # files for all retained story details, including older event anchors.
          import re
          ids=[p.stem for p in (root/"data/story").glob("*.json")
               if re.fullmatch(r"[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}",p.stem)]
          # Include previously shared event URLs, even if the anchor story aged
          # out of the latest compact feed. The SPA will offer an archive fallback.
          ids=sorted(set(ids+["9883cb58-e3da-4f35-8684-3ec9a6b70a37"]))
          for sid in ids:
              dest=root/"event"/("event-"+sid)/"index.html"
              if not dest.is_file():
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(shell,dest)
          # Fallback keeps SPA routing available for less common generated paths.
          shutil.copy2(shell,root/"404.html")
          assert (root/"event"/"event-9883cb58-e3da-4f35-8684-3ec9a6b70a37"/"index.html").is_file()
          assert (root/"404.html").is_file()
          print("Ensured",len(stories),"news entry pages; newly created",made,
                "; event dossiers",len(ids),flush=True)
          PY
      - name: Restore cached book shelf entry only (no collectors)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("site")
          cached=root/"books-data.js"
          if not cached.is_file() or cached.stat().st_size<1000 or cached.stat().st_size>2000000:
              print("::warning::Cached book data unavailable or over 2MB; skipping book shelf activation.")
          else:
              target=root/"books"/"index.html"
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(root/"index.html",target)
              assert target.is_file()
              print(f"Cached book shelf entry enabled; data bytes={cached.stat().st_size}; zero new API calls")
          PY
      - name: Restore cached film and television entrances (no API refresh)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('site')
          shell=root/'index.html'
          cached=root/'movies-data.js'
          if cached.is_file() and 1000 < cached.stat().st_size < 2000000:
              for section in ('movies','tv'):
                  dest=root/section/'index.html'
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(shell,dest)
              print(f'Static movie and TV entry pages restored; cached film JS: {cached.stat().st_size} bytes; no API calls.')
          else:
              print('::warning::Cached movie catalog missing or above 2MB; film and TV entrances not enabled.')
          PY
      - name: Preserve validated lightweight news and figures only
        run: |
          python backend/scripts/prepare_priority_site.py site
          python backend/scripts/audit_pages_size.py site 750000000
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('site/data')
          figures=json.loads((root/'figures.json').read_text(encoding='utf-8'))
          stories=json.loads((root/'stories.json').read_text(encoding='utf-8'))
          assert len(figures.get('figures',[])) >= 100, 'Figure corpus unexpectedly small'
          assert 1 <= len(stories) <= 60, 'News headline feed invalid'
          missing=[str(row.get('id')) for row in stories if isinstance(row,dict) and row.get('id') and not (root/'story'/(str(row['id'])+'.json')).is_file()]
          if missing:
              raise SystemExit('::error::Missing story detail JSON for published headlines: '+', '.join(missing[:8]))
          print('Fast publish validated:',len(stories),'headlines and',len(figures['figures']),'figures; all story details available')
          PY
      - name: Report published figure freshness
        run: |
          python - <<'PY'
          import json,datetime,pathlib
          root=pathlib.Path("site/data")
          d=json.loads((root/"figures.json").read_text(encoding="utf-8"))
          now=datetime.datetime.now(datetime.timezone.utc)
          dates=[]
          for figure in d.get("figures",[]):
              for post in figure.get("posts",[]):
                  try:
                      dt=datetime.datetime.fromisoformat(str(post.get("published_at","")).replace("Z","+00:00"))
                      if dt.tzinfo is None:dt=dt.replace(tzinfo=datetime.timezone.utc)
                      dates.append(dt.astimezone(datetime.timezone.utc))
                  except ValueError:pass
          recent=sum(now-datetime.timedelta(hours=24)<=t<=now for t in dates)
          last=max(dates).isoformat() if dates else "none"
          print(f"Published figures: {len(d.get('figures',[]))}; valid statements: {len(dates)}; 24h: {recent}; latest: {last}; generated_at: {d.get('generated_at','missing')}",flush=True)
          if not dates:raise SystemExit("::error::No dated figure statements in publish payload")
          PY
      - name: Upload light Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
  deploy:
    needs: build-ui
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy news and figures to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
