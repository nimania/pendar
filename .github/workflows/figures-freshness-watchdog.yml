name: Pendar Figures Freshness Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "19 * * * *"

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare collector success with published figure health
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          import sys
          from urllib.request import Request, urlopen

          repo = os.environ["REPO"]
          now = dt.datetime.now(dt.timezone.utc)

          def gh(path, method=None, fields=None):
              cmd = ["gh", "api", f"repos/{repo}/{path}"]
              if method:
                  cmd += ["--method", method]
              for key, value in (fields or {}).items():
                  cmd += ["-f", f"{key}={value}"]
              result = subprocess.run(cmd, capture_output=True, text=True, check=True)
              return json.loads(result.stdout) if result.stdout.strip() else {}

          def parse(value):
              stamp = dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              return stamp.replace(tzinfo=dt.timezone.utc) if stamp.tzinfo is None else stamp

          def age_minutes(value):
              return (now - parse(value)).total_seconds() / 60

          runs = gh("actions/workflows/figures-refresh.yml/runs?per_page=50").get("workflow_runs", [])
          successful = next((r for r in runs if r.get("conclusion") == "success"), None)
          active = any(r.get("status") in ("queued", "in_progress", "waiting", "pending") for r in runs)
          collector_age = age_minutes(successful["updated_at"]) if successful else float("inf")
          reasons = []
          if collector_age > 120 and not active:
              reasons.append(f"Figure collector last success: {collector_age:.0f} minutes ago")

          try:
              request = Request("https://pendar.io/data/figures-health.json",
                                headers={"User-Agent": "PendarFiguresWatchdog/1.0",
                                         "Cache-Control": "no-cache"})
              with urlopen(request, timeout=15) as response:
                  health = json.load(response)
              assert isinstance(health, dict), "Figure health must be a JSON object"
              assert health.get("last_checked_at"), "Missing last_checked_at"
              published_age = age_minutes(health["last_checked_at"])
              count = health.get("figures")
              assert isinstance(count, int) and count >= 100, f"Invalid figure count: {count!r}"
              if published_age > 150:
                  reasons.append(f"Published figure check: {published_age:.0f} minutes ago")
              print(f"Collector age: {collector_age:.0f}m; published check age: {published_age:.0f}m; figures: {count}")
              # Do not require fresh statements: source silence is not a collector failure.
              print(f"Statements in past 24h: {health.get('statements_24h', 'unknown')}")
          except Exception as exc:
              reasons.append(f"Published figure health inaccessible or invalid: {exc}")

          title = "[Pendar] Figures freshness stalled"
          open_issues = gh("issues?state=open&per_page=100")
          existing = next((i for i in open_issues if i.get("title") == title and not i.get("pull_request")), None)
          if reasons:
              body = ("Figure freshness warning. Collector success alone does not prove publication.\n\n"
                      + "\n".join(reasons) + "\n\n"
                      + f"Workflow: https://github.com/{repo}/actions/workflows/figures-refresh.yml\n"
                      + "Inspect the collector and fast-deploy jobs. Preserve the last healthy published snapshot.")
              if not existing:
                  gh("issues", "POST", {"title": title, "body": body})
                  print("Opened figure freshness issue")
              else:
                  print("Existing issue:", existing["html_url"])
              sys.exit(1)

          if existing:
              gh(f"issues/{existing['number']}", "PATCH", {"state": "closed", "state_reason": "completed"})
          print("Figure collector and published figure check are fresh")
          PY
