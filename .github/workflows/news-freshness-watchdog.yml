name: Pendar News Freshness Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest successful news collection and raise or resolve alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          import sys

          repo = os.environ["REPO"]
          def gh(*args):
              p = subprocess.run(["gh", "api", *args], capture_output=True, text=True)
              if p.returncode:
                  raise RuntimeError(p.stderr.strip())
              return json.loads(p.stdout)

          now = dt.datetime.now(dt.timezone.utc)
          runs = gh(f"repos/{repo}/actions/workflows/news-refresh.yml/runs?per_page=30").get("workflow_runs", [])
          successful = next((r for r in runs if r.get("conclusion") == "success"), None)
          ongoing = [r for r in runs if r.get("status") in ("queued", "in_progress", "waiting", "pending")]
          if successful:
              completed = dt.datetime.fromisoformat(successful["updated_at"].replace("Z", "+00:00"))
              age = (now - completed).total_seconds() / 60
              print(f"Last successful news collection: {successful['html_url']} ({age:.0f} minutes old)")
          else:
              age = float("inf")
              print("No successful news collection found in latest 30 runs")
          # A green Actions run only proves the job exited successfully.
          # Independently inspect the published, lightweight news JSON files.
          # Never trigger collection or mutate the news archive here.
          from urllib.request import Request, urlopen
          def published_json(name):
              req = Request(f"https://pendar.io/data/{name}", headers={"User-Agent":"PendarNewsWatchdog/1.0","Cache-Control":"no-cache"})
              with urlopen(req, timeout=15) as response:
                  return json.load(response)
          publish_age = float("inf")
          story_age = float("inf")
          site_error = None
          try:
              meta = published_json("meta.json")
              cards = published_json("stories.json")
              stamp = str(meta.get("built_iso") or "")
              published = dt.datetime.fromisoformat(stamp.replace("Z","+00:00"))
              publish_age = (now-published).total_seconds()/60
              dates = []
              for card in cards if isinstance(cards,list) else []:
                  try:
                      value = str(card.get("published_at") or "")
                      parsed = dt.datetime.fromisoformat(value.replace("Z","+00:00"))
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=dt.timezone.utc)
                      if parsed <= now + dt.timedelta(minutes=15):
                          dates.append(parsed)
                  except (TypeError, ValueError):
                      pass
              if dates:
                  story_age = (now-max(dates)).total_seconds()/60
              print(f"Published build age: {publish_age:.0f} min; newest headline age: {story_age:.0f} min; items: {len(cards) if isinstance(cards,list) else 'invalid'}")
          except Exception as exc:
              site_error = str(exc)
              print(f"::warning::Could not read published news status: {site_error}")
          # Unreachable or malformed published data must fail the health check, even if collection succeeded.
          stale = bool(site_error) or age > 60 or publish_age > 120 or story_age > 180
          reasons = []
          if age > 60: reasons.append(f"Collector last success: {age:.0f} minutes ago")
          if publish_age > 120: reasons.append(f"Published build: {publish_age:.0f} minutes ago")
          if story_age > 180: reasons.append(f"Newest headline: {story_age:.0f} minutes ago")
          if site_error: reasons.append(f"Website status check unavailable: {site_error}")
          # Issues opened by this watchdog use a stable title for de-duplication.
          title = "[Pendar] News freshness stalled"
          issues = gh(f"repos/{repo}/issues?state=open&per_page=100")
          existing = next((i for i in issues if i.get("title") == title and not i.get("pull_request")), None)
          if stale:
              recent = runs[0] if runs else None
              url = recent.get("html_url") if recent else f"https://github.com/{repo}/actions/workflows/news-refresh.yml"
              body = (f"News freshness warning (collector, published build, or newest headline).\\n\\n"
                      f"Latest run: {url}\\n"
                      f"Last success: {successful['html_url'] if successful else 'not found'}\\n"
                      f"Currently queued/running: {len(ongoing)}\\n"
                      + "\\n".join(reasons) + "\\n\\n"
                      + "Inspect news collection and preserve the previous healthy publication. "
                      + "This issue is managed by the freshness watchdog.")
              if not existing:
                  subprocess.run(["gh", "api", f"repos/{repo}/issues", "--method", "POST",
                                  "-f", f"title={title}", "-f", f"body={body}"], check=True)
                  print("Opened news freshness alert")
              else:
                  print(f"Existing alert: {existing['html_url']}")
              sys.exit(1)
          if existing:
              subprocess.run(["gh", "api", f"repos/{repo}/issues/{existing['number']}",
                              "--method", "PATCH", "-f", "state=closed",
                              "-f", "state_reason=completed"], check=True)
              print("Closed recovered news freshness alert")
          print("News collection freshness OK")
          PY
