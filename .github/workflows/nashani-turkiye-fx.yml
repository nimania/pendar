name: Nashani Turkiye FX monitoring
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: "Preview rates without sending"
  schedule:
    # Poll the official business-day rate publication from 15:45 Istanbul time onward.
    - cron: '45 12,14,16,18 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nashani-turkiye-fx.yml'
      - 'nashani_turkey/fx.py'
permissions:
  contents: write
concurrency:
  group: nashani-turkiye-fx
  cancel-in-progress: false
jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile nashani_turkey/fx.py
      - name: Monitor official TRY rates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NASHANI_TELEGRAM_BOT_TOKEN: ${{ secrets.NASHANI_TELEGRAM_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python nashani_turkey/fx.py --dry-run
          else
            python nashani_turkey/fx.py
          fi
