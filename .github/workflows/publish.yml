name: Refresh and publish Pendar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pendar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh cultural feeds
        id: feeds
        continue-on-error: true
        run: python scripts/ingest.py
      - name: Build and check links
        run: |
          python scripts/build.py
          python scripts/check.py
      - name: Save feed history and health
        run: |
          git config user.name 'pendar-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/articles.json data/ingestion.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh cultural feeds [skip ci]'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
