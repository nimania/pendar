name: Nashani Kerman city-news radar

on:
  schedule:
    - cron: '*/5 * * * *'
  pull_request:
    paths:
      - 'nashani/**'
      - '.github/workflows/nashani-kerman.yml'
  workflow_dispatch:
    inputs:
      approve_id:
        description: 'Optional exact 16-char reviewed story ID to publish'
        required: false
        type: string
      check_connection:
        description: 'Verify @neshanikermanbot is an admin of @neshanikerman; do not send a message'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nashani-kerman-radar
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - run: python -m unittest discover -s nashani/tests -p 'test_*.py' -v
      - name: Public-source smoke test (read-only)
        run: python nashani/runner.py --dry-run

  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Unit tests
        run: python -m unittest discover -s nashani/tests -p 'test_*.py' -v
      - name: Monitor sources and update isolated ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NASHANI_TELEGRAM_BOT_TOKEN: ${{ secrets.NASHANI_TELEGRAM_BOT_TOKEN }}
          NASHANI_CHANNEL_ID: '@neshanikerman'
          NASHANI_PUBLISH_ENABLED: ${{ vars.NASHANI_PUBLISH_ENABLED }}
          APPROVE_ID: ${{ inputs.approve_id }}
          CHECK_CONNECTION: ${{ inputs.check_connection }}
        run: |
          if [ "$CHECK_CONNECTION" = "true" ]; then
            python nashani/runner.py --check-connection
          elif [ -n "$APPROVE_ID" ]; then
            python nashani/runner.py --approve "$APPROVE_ID"
          else
            python nashani/runner.py
          fi
