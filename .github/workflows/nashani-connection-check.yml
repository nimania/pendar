name: Nashani Telegram Connection Check

on:
  push:
    paths:
      - '.github/workflows/nashani-connection-check.yml'
      - 'nashani/runner.py'
      - '.github/workflows/nashani-kerman.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nashani-telegram-connection-check
  cancel-in-progress: false

jobs:
  verify:
    name: Verify configured Telegram bot without posting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validate BotFather token, exact channel, and posting permission
        env:
          NASHANI_TELEGRAM_BOT_TOKEN: ${{ secrets.NASHANI_TELEGRAM_BOT_TOKEN }}
          NASHANI_CHANNEL_ID: '@neshanikerman'
        run: python nashani/runner.py --check-connection
