name: Collect AI figure sources for review
on:
  workflow_dispatch:
  schedule:
    - cron: '26 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'backend/data/ai-figure-sources.json'
      - 'backend/scripts/collect_ai_figure_sources.py'
      - '.github/workflows/ai-figure-intake.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Collect public posts for editorial review only
        run: python backend/scripts/collect_ai_figure_sources.py
      - name: Save pending review queue even if source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-figure-intake
          path: ai-figure-intake.json
          retention-days: 14
