name: Jan Kalam transcript pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/jankalam_transcript_pilot.py'
      - '.github/workflows/jankalam-transcript-pilot.yml'

permissions:
  contents: read

jobs:
  test-captions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install caption extractor
        run: python -m pip install 'yt-dlp>=2026.03.01'
      - name: Check first three videos (no changes to production)
        run: python tools/jankalam_transcript_pilot.py
      - name: Preserve results and diagnostic manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jankalam-transcript-pilot
          path: artifacts/jankalam-transcripts/
          if-no-files-found: warn
          retention-days: 7
