name: Recipe Lab privacy checks
on:
  push:
    branches: [feature/private-recipes-v2]
  pull_request:
    paths:
      - 'backend/app/recipe_lab.py'
      - 'backend/tests/test_recipe_lab_auth.py'
      - '.github/workflows/recipe-lab-tests.yml'
jobs:
  private-recipe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: python -m pip install 'fastapi>=0.115' 'httpx>=0.28' 'pytest>=8'
      - name: Test private route, no server secrets needed
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_recipe_lab_auth.py -q --confcutdir=backend/tests
