name: Naval Observer — independent source digest
on:
  schedule:
    - cron: '13 4,16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: naval-public-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify independent collector
        run: python -m py_compile backend/scripts/collect_naval_brief.py
      - name: Read last published naval archive
        run: |
          git fetch --no-tags --depth=1 origin naval-data
          git show FETCH_HEAD:naval/events.json > /tmp/naval-existing.json
          test -s /tmp/naval-existing.json
      - name: Collect delayed public reports (never ship positions)
        run: python backend/scripts/collect_naval_brief.py --existing /tmp/naval-existing.json --output /tmp/naval-updated.json
      - name: Validate archive integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('/tmp/naval-existing.json').read_text())
          new=json.loads(Path('/tmp/naval-updated.json').read_text())
          assert isinstance(new.get('events'),list) and 5 <= len(new['events']) <= 300
          assert set(x['id'] for x in old['events']).issubset(set(x['id'] for x in new['events']))
          assert all(x.get('source') and str(x.get('url','')).startswith('https://') and x.get('date') for x in new['events'])
          assert not any(k in x for x in new['events'] for k in ('latitude','longitude','lat','lon','lng','coordinates','route','track'))
          print('Verified', len(new['events']), 'regional, source-linked entries')
          PY
      - name: Update naval-data branch only; never rebuild Pendar
        run: |
          git checkout -B naval-data FETCH_HEAD
          mkdir -p naval
          cp /tmp/naval-updated.json naval/events.json
          git add naval/events.json
          if git diff --cached --quiet; then
            echo "No changes in naval archive; no commit or Pages deployment."
          else
            git -c user.name='pendar-naval-bot' -c user.email='actions@users.noreply.github.com' commit -m 'data(naval): update delayed sourced naval events'
            git push origin HEAD:naval-data
          fi
