name: Validate Iran Scenario Radar
on:
  pull_request:
    paths:
      - 'backend/scripts/build_iran_scenario_radar.py'
      - 'backend/scripts/prepare_priority_site.py'
      - 'backend/tests/test_iran_scenario_radar.py'
      - 'web-static/radar/iran-scenarios/index.html'
      - 'web-static/data/iran-scenario-seed.json'
      - '.github/workflows/fast-deploy.yml'
      - '.github/workflows/iran-scenario-radar-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax and run deterministic tests
        run: |
          python -m py_compile backend/scripts/build_iran_scenario_radar.py
          python -m unittest discover -s backend/tests -p 'test_iran_scenario_radar.py' -v
      - name: Check scenario seed and public data contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('web-static/data/iran-scenario-seed.json').read_text(encoding='utf-8'))
          assert len(rows)==8
          assert len({x['id'] for x in rows})==len(rows)
          html=Path('web-static/radar/iran-scenarios/index.html').read_text(encoding='utf-8')
          assert '/data/iran-scenario-signals.json' in html
          assert '/data/iran-scenario-history.json' in html
          assert 'trendplot' in html and 'componentscores' in html
          from sys import path
          path.insert(0,'backend/scripts')
          from prepare_priority_site import keep_data_file
          assert keep_data_file('iran-scenario-signals.json')
          assert keep_data_file('iran-scenario-meta.json')
          assert keep_data_file('iran-scenario-history.json')
          PY
