name: Pendar Movie Master

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"
  push:
    branches: [main]
    paths:
      - "backend/scripts/build_movie_master.py"
      - "backend/scripts/hydrate_movie_master.py"
      - "backend/scripts/queue_creator_movies.py"
      - ".github/workflows/movie-master.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: movie-master
  cancel-in-progress: true

jobs:
  build-master:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Movie Master database
        uses: actions/cache@v4
        with:
          path: backend/data/movie-master.sqlite
          key: pendar-movie-master-${{ github.run_id }}
          restore-keys: |
            pendar-movie-master-

      - name: Restore latest successful Movie Master artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/movie-master.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -n "$prev_id" ]; then
            rm -rf /tmp/movie-master-prev && mkdir -p /tmp/movie-master-prev
            if gh run download "$prev_id" -n pendar-movie-master-db -D /tmp/movie-master-prev; then
              src="$(find /tmp/movie-master-prev -type f -name 'movie-master.sqlite.gz' | head -1)"
              if [ -n "$src" ]; then
                mkdir -p backend/data
                gzip -dc "$src" > backend/data/movie-master.sqlite
                echo "Restored Movie Master DB from run $prev_id"
              fi
            fi
          fi

      - name: Download latest Jan Film catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p backend/data
          build_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -n "$build_id" ]; then
            rm -rf /tmp/pendar-latest && mkdir -p /tmp/pendar-latest
            if gh run download "$build_id" -n latest-static-site -D /tmp/pendar-latest; then
              if [ -f /tmp/pendar-latest/data/movies.json ]; then
                cp /tmp/pendar-latest/data/movies.json backend/data/curated-movies.json
              fi
            fi
          fi
          if [ ! -f backend/data/curated-movies.json ] && [ -f web-static/data/movies.json ]; then
            cp web-static/data/movies.json backend/data/curated-movies.json
          fi

      - name: Build Movie Master from official TMDB daily exports
        run: |
          mkdir -p backend/data backend/public/data
          python backend/scripts/build_movie_master.py \
            --db backend/data/movie-master.sqlite \
            --summary backend/public/data/movie-master-summary.json \
            --top backend/public/data/movie-master-top.json \
            --curated-movies backend/data/curated-movies.json \
            --top-limit 20000

      - name: Prioritize existing creator works
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python backend/tests/test_creator_movie_priority.py
          mkdir -p /tmp/creator-work-audit
          audit_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "creator-work-reconciliation" and .expired == false)][0].workflow_run.id // empty')"
          if [ -n "$audit_run" ]; then
            gh run download "$audit_run" -n creator-work-reconciliation -D /tmp/creator-work-audit
            python backend/scripts/queue_creator_movies.py --db backend/data/movie-master.sqlite --audit /tmp/creator-work-audit/creator-work-audit.json
          fi

      - name: Hydrate priority Movie Master titles
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          python backend/scripts/hydrate_movie_master.py \
            --db backend/data/movie-master.sqlite \
            --limit 5000 \
            --workers 4 \
            --summary backend/public/data/movie-master-summary.json \
            --top backend/public/data/movie-master-top.json \
            --top-limit 20000

      - name: Validate master database
        run: |
          python - <<'PY'
          import json, pathlib, sqlite3
          db=pathlib.Path("backend/data/movie-master.sqlite")
          summary=pathlib.Path("backend/public/data/movie-master-summary.json")
          assert db.exists() and db.stat().st_size > 1024 * 1024, "master DB is unexpectedly small"
          data=json.loads(summary.read_text(encoding="utf-8"))
          total=int(data["stats"]["total_active"])
          movies=int(data["stats"]["movies"])
          series=int(data["stats"]["series"])
          assert total == movies + series
          assert movies > 100000 and series > 10000, (movies, series)
          con=sqlite3.connect(db)
          dup=con.execute("SELECT COUNT(*) FROM (SELECT media_type,tmdb_id,COUNT(*) c FROM titles GROUP BY media_type,tmdb_id HAVING c>1)").fetchone()[0]
          assert dup == 0, f"duplicate TMDB identities: {dup}"
          print("Validated:", json.dumps(data["stats"], ensure_ascii=False))
          PY

      - name: Compress master database
        run: gzip -9 -c backend/data/movie-master.sqlite > backend/data/movie-master.sqlite.gz

      - name: Upload Movie Master database
        uses: actions/upload-artifact@v4
        with:
          name: pendar-movie-master-db
          path: backend/data/movie-master.sqlite.gz
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload Movie Master public indexes
        uses: actions/upload-artifact@v4
        with:
          name: pendar-movie-master-indexes
          path: |
            backend/public/data/movie-master-summary.json
            backend/public/data/movie-master-top.json
            backend/public/data/movie-master-details/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

