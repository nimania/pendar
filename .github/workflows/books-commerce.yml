name: Refresh book radar and commerce

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/scripts/enrich_books_torob.py"
      - "backend/scripts/build_books.py"
      - "backend/scripts/merge_book_commerce.py"
      - "backend/scripts/book_catalog.py"
      - "backend/scripts/book_radar.py"
      - "backend/scripts/collect_book_radar.py"
      - "backend/book-radar-sources.json"
      - "backend/tests/test_book_radar.py"
      - "web-static/data/book-curation.json"
      - ".github/workflows/books-commerce.yml"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: book-commerce-refresh
  cancel-in-progress: true

jobs:
  build-commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify book identity and commerce preservation
        run: python -m unittest discover -s backend/tests -p 'test_book*.py' -v

      - name: Find latest complete periodicals site and weather
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          press_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/periodicals.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          weather_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/weather.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          commerce_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/books-commerce.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          test -n "$press_id"
          echo "press_id=$press_id" >> "$GITHUB_OUTPUT"
          echo "weather_id=$weather_id" >> "$GITHUB_OUTPUT"
          echo "commerce_id=$commerce_id" >> "$GITHUB_OUTPUT"

      - name: Download latest complete periodicals site
        env:
          GH_TOKEN: ${{ github.token }}
          PRESS_ID: ${{ steps.base.outputs.press_id }}
        run: |
          rm -rf site /tmp/press-pages
          mkdir -p site /tmp/press-pages
          gh run download "$PRESS_ID" -n github-pages -D /tmp/press-pages
          test -f /tmp/press-pages/artifact.tar
          tar -xf /tmp/press-pages/artifact.tar -C site

      - name: Restore recent Torob snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f site/data/books.json || exit 0
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/books-commerce.yml/runs?status=success&per_page=5" --jq '.workflow_runs[].id')
          n=0
          for id in "${ids[@]}"; do
            n=$((n+1))
            dir="/tmp/previous-commerce-$n"
            rm -rf "$dir" && mkdir -p "$dir"
            if gh run download "$id" -n books-commerce-data -D "$dir"; then
              src="$(find "$dir" -type f -name books.json | head -1)"
              if [ -n "$src" ]; then
                python backend/scripts/merge_book_commerce.py --source "$src" --target site/data/books.json --target-js site/data/books.js
              fi
              assets="$(find "$dir" -type d -path '*/assets/books' | head -1)"
              if [ -n "$assets" ]; then
                mkdir -p site/assets/books
                rsync -a "$assets/" site/assets/books/
              fi
            fi
          done

      - name: Discover books independently from public store shelves and review feeds
        run: |
          python -m pip install requests beautifulsoup4
          python backend/scripts/collect_book_radar.py --catalog site/data/books.json --out-js site/data/books.js

      - name: Enrich books with Torob sellers and prices
        env:
          TOROB_BOOK_LIMIT: "6"
          TOROB_MCP_GAP: "5.5"
        run: |
          mkdir -p backend/public/data backend/public/assets/books
          cp site/data/books.json backend/public/data/books.json
          if [ -f site/data/books.js ]; then cp site/data/books.js backend/public/data/books.js; fi
          if [ -d site/assets/books ]; then rsync -a site/assets/books/ backend/public/assets/books/; fi
          python backend/scripts/enrich_books_torob.py
          cp backend/public/data/books.json site/data/books.json
          cp backend/public/data/books.js site/data/books.js
          mkdir -p site/assets/books
          rsync -a backend/public/assets/books/ site/assets/books/

      - name: Save reusable commerce data
        uses: actions/upload-artifact@v4
        with:
          name: books-commerce-data
          path: |
            backend/public/data/books.json
            backend/public/data/books.js
            backend/public/assets/books/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Overlay freshest weather
        env:
          GH_TOKEN: ${{ github.token }}
          WEATHER_ID: ${{ steps.base.outputs.weather_id }}
        run: |
          if [ -n "$WEATHER_ID" ]; then
            rm -rf /tmp/weather && mkdir -p /tmp/weather
            if gh run download "$WEATHER_ID" -n weather-data -D /tmp/weather && [ -f /tmp/weather/weather.json ]; then
              mkdir -p site/data
              cp /tmp/weather/weather.json site/data/weather.json
            fi
          fi

      - name: Overlay current UI and cache-bust
        run: |
          rsync -a --exclude 'data/' web-static/ site/
          python - <<'PY'
          import hashlib, pathlib, re
          root=pathlib.Path("site")
          versions={}
          for name in ("app.js","styles.css","books-hub.js","books-hub.css","book-radar-ui.js","book-radar-data.js","book-curation.js","iran-provinces.js","data/press-directory.js","data/books.js"):
              p=root/name
              if p.exists():
                  versions[name]=hashlib.md5(p.read_bytes()).hexdigest()[:8]
          idx=root/"index.html"
          text=idx.read_text(encoding="utf-8")
          for name,version in versions.items():
              text=re.sub(r'((?:src|href)="' + re.escape(name) + r')(?:\?v=[0-9a-f]+)?(")',
                          r'\1?v=' + version + r'\2', text)
          idx.write_text(text,encoding="utf-8")
          sw=root/"sw.js"
          app_v=versions.get("app.js")
          if sw.exists() and app_v:
              s=sw.read_text(encoding="utf-8")
              s=re.sub(r'const V = "[^"]*";', f'const V = "jankalam-{app_v}";', s, count=1)
              sw.write_text(s,encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: books-commerce-pages-${{ github.run_attempt }}
          path: site

  deploy:
    needs: build-commerce
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy book commerce refresh
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: books-commerce-pages-${{ github.run_attempt }}
