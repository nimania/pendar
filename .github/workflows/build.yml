name: Build & Deploy Pendar (static)

# Runs OUTSIDE Iran on GitHub's servers, so it can reach news sources and the AI.
# A push to main also republishes front-end changes such as the figures timeline.
# It generates the news and publishes a static site to GitHub Pages — free.
on:
  workflow_dispatch:
    inputs:
      resolve_url:
        description: "Recovery only: original Telegram post URL after checking the channel"
        required: false
        type: string
      resolution:
        description: "Recovery only: mark an uncertain delivery sent, or retry if absent"
        required: false
        default: mark_sent
        type: choice
        options: [mark_sent, retry]
      premium_video_id:
        description: "Build an opt-in recording script for this YouTube video ID"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "*/15 * * * *"            # every 15 minutes (the build DB is cached, so each
                                    # run only synthesizes genuinely NEW stories)

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scheduled refreshes remain serialized. A newer code push supersedes an
  # older push, so stale builds cannot block urgent pipeline fixes.
  group: data-refresh
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify book identity and commerce preservation
        run: python -m unittest discover -s backend/tests -p test_book_catalog.py -v
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Check Telegram publishing
        run: python -m unittest discover -s tests -p 'test_telegram_publish.py'
      - name: Check Telegram digest
        run: python -m unittest discover -s tests -p 'test_telegram_digest.py'
      # Persist the news DB between hourly runs so we DON'T re-synthesize the same
      # stories every hour (only new clusters cost an AI call). Restores the most
      # recent cache; always saves a fresh one (unique key + prefix restore-keys).
      - name: Restore news database (cache)
        uses: actions/cache@v4
        with:
          # Keep the database cache path stable forever. GitHub includes the
          # path list in its cache version, so adding unrelated files here can
          # silently orphan the entire historical news database.
          path: backend/build.db
          key: jankalam-db-${{ github.run_id }}
          restore-keys: |
            jankalam-db-

      - name: Restore external figure feed cache
        uses: actions/cache@v4
        with:
          path: |
            backend/data/external-figure-posts.json
            backend/data/youtube-recap-state.json
            backend/data/youtube-transcripts.json
            backend/data/project-finance.json
          key: jankalam-extfig-${{ github.run_id }}
          restore-keys: |
            jankalam-extfig-
      - name: Collect figure videos and recaps
        working-directory: backend
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL_STRONG: ${{ secrets.AI_MODEL_STRONG }}
          DOWNSUB_API_KEY: ${{ secrets.DOWNSUB_API_KEY }}
          PREMIUM_VIDEO_ID: ${{ inputs.premium_video_id }}
        run: python -m scripts.collect_external_figures
      - name: Generate news (ingest → cluster → rank → synthesize → export)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./build.db"
          # These come from repo Settings → Secrets. If unset, the free offline
          # mock is used (placeholder synthesis). AI_API_KEY may hold SEVERAL keys
          # (comma-separated) — the provider rotates through them on rate limits.
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL_STRONG: ${{ secrets.AI_MODEL_STRONG }}
          DOWNSUB_API_KEY: ${{ secrets.DOWNSUB_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python -m scripts.seed
          python -c "from app.tasks.scheduler import run_full_cycle; print(run_full_cycle())"
          python -m scripts.export_static
          python -m scripts.build_periodicals
      - name: Overlay freshest Jan-e Jaraid data before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          press_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/periodicals.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$press_id" ]; then
            echo "::warning::No successful periodicals run found; keeping generated build data."
            exit 0
          fi
          rm -rf /tmp/press-pages /tmp/press-site
          mkdir -p /tmp/press-pages /tmp/press-site
          if gh run download "$press_id" -n github-pages -D /tmp/press-pages && [ -f /tmp/press-pages/artifact.tar ]; then
            tar -xf /tmp/press-pages/artifact.tar -C /tmp/press-site
            mkdir -p backend/public/data
            for name in periodicals.json press-directory.json press-directory.js books.json books.js movies.json movies.js press-registry-health.json; do
              if [ -f "/tmp/press-site/data/$name" ]; then
                cp "/tmp/press-site/data/$name" "backend/public/data/$name"
              fi
            done
            if [ -d /tmp/press-site/assets/periodicals ]; then
              mkdir -p backend/public/assets/periodicals
              rsync -a /tmp/press-site/assets/periodicals/ backend/public/assets/periodicals/
            fi
          else
            echo "::warning::Could not download latest periodicals artifact; keeping generated build data."
          fi

          weather_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/weather.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -n "$weather_id" ]; then
            rm -rf /tmp/weather && mkdir -p /tmp/weather
            if gh run download "$weather_id" -n weather-data -D /tmp/weather && [ -f /tmp/weather/weather.json ]; then
              mkdir -p backend/public/data
              cp /tmp/weather/weather.json backend/public/data/weather.json
            fi
          fi

      - name: Refresh TV Guide EPG
        continue-on-error: true
        run: python backend/scripts/build_tv_guide.py --output backend/public/data/tv-guide.json

      - name: Rebuild book graph against fresh news, figures and press
        working-directory: backend
        run: python -m scripts.build_books

      - name: Restore movie identity cache
        uses: actions/cache@v4
        with:
          path: |
            backend/data/movie_identity_cache.json
            backend/data/movie_seen_cache.json
            backend/data/movie_imdb_cache.json
          key: pendar-movie-identity-${{ github.run_id }}
          restore-keys: |
            pendar-movie-identity-

      - name: Rebuild film graph against fresh news, figures and press
        working-directory: backend
        run: python -m scripts.build_movies

      - name: Enrich film catalog from EPG
        continue-on-error: true
        run: python backend/scripts/enrich_movies_from_epg.py --tv backend/public/data/tv-guide.json --movies backend/public/data/movies.json --movies-js backend/public/data/movies.js

      - name: Enrich IMDb IDs
        continue-on-error: true
        run: python backend/scripts/enrich_imdb_ids.py --movies backend/public/data/movies.json --movies-js backend/public/data/movies.js --cache backend/data/movie_imdb_cache.json

      - name: Collect 30nama public archive
        continue-on-error: true
        run: python backend/scripts/collect_30nama_archive.py --output backend/public/data/30nama.json --movies backend/public/data/movies.json --movies-js backend/public/data/movies.js

      - name: Build streaming availability
        continue-on-error: true
        run: python backend/scripts/build_streaming_availability.py --movies backend/public/data/movies.json --output backend/public/data/streaming.json

      - name: Link TV Guide to canonical movies
        continue-on-error: true
        run: python backend/scripts/link_tv_guide_movies.py --tv backend/public/data/tv-guide.json --movies backend/public/data/movies.json --streaming backend/public/data/streaming.json

      - name: Merge freshest Torob commerce into current books
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commerce_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/books-commerce.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -n "$commerce_id" ]; then
            rm -rf /tmp/book-commerce && mkdir -p /tmp/book-commerce
            if gh run download "$commerce_id" -n books-commerce-data -D /tmp/book-commerce; then
              src="$(find /tmp/book-commerce -type f -name books.json | head -1)"
              if [ -n "$src" ] && [ -f backend/public/data/books.json ]; then
                python backend/scripts/merge_book_commerce.py --source "$src" --target backend/public/data/books.json --target-js backend/public/data/books.js
              fi
              assets="$(find /tmp/book-commerce -type d -path '*/assets/books' | head -1)"
              if [ -n "$assets" ]; then
                mkdir -p backend/public/assets/books
                rsync -a "$assets/" backend/public/assets/books/
              fi
            fi
          fi

      - name: Overlay freshest Movie Master indexes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          movie_master_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/movie-master.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -n "$movie_master_id" ]; then
            rm -rf /tmp/movie-master && mkdir -p /tmp/movie-master
            if gh run download "$movie_master_id" -n pendar-movie-master-indexes -D /tmp/movie-master; then
              mkdir -p backend/public/data
              find /tmp/movie-master -type f \( -name 'movie-master-summary.json' -o -name 'movie-master-top.json' \) -exec cp {} backend/public/data/ \;
              details="$(find /tmp/movie-master -type d -name movie-master-details | head -1)"
              if [ -n "$details" ]; then
                mkdir -p backend/public/data/movie-master-details
                rsync -a "$details/" backend/public/data/movie-master-details/
              fi
            fi
          fi

      - name: Restore existing profile labels for migration
        uses: actions/cache/restore@v4
        with:
          path: backend/data/cinema-people-cache.json
          key: cinema-people-migration-${{ github.run_id }}
          restore-keys: cinema-people-

      - name: Restore person profile cache
        uses: actions/cache@v4
        with:
          path: backend/data/people-profile-cache.json
          key: people-profile-${{ github.run_id }}
          restore-keys: people-profile-

      - name: Restore creator catalog cache
        uses: actions/cache@v4
        with:
          path: backend/data/creator-catalog-cache.json
          key: creator-catalog-${{ github.run_id }}
          restore-keys: creator-catalog-

      - name: Test creator identities and relationships
        run: python backend/tests/test_creator_catalog.py

      - name: Enrich verified book and film creators
        run: python backend/scripts/enrich_creator_catalog.py --data-dir backend/public/data

      - name: Create sourced internal book pages
        run: |
          python backend/tests/test_materialize_creator_books.py
          python backend/scripts/materialize_creator_books.py --data-dir backend/public/data

      - name: Build people and sourced ratings
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python backend/scripts/build_people.py --data-dir backend/public/data

      - name: Include current candidate news in the full site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/candidate-feeds.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          mkdir -p /tmp/candidate-data backend/public/data
          if [ -n "$candidate_run" ] && gh run download "$candidate_run" -n candidate-feeds -D /tmp/candidate-data; then
            cp /tmp/candidate-data/candidate-feeds.json backend/public/data/candidate-feeds.json
          else
            python backend/scripts/collect_candidate_feeds.py --out backend/public/data/candidate-feeds.json
          fi

      - name: Collect Bartarinha entertainment feed for Badbadak
        continue-on-error: true
        run: python -m scripts.collect_bartarinha --out public/data/bartarinha-feed.json
        working-directory: backend

      - name: Collect Rokna crime/accident feed for Badbadak
        continue-on-error: true
        run: python -m scripts.collect_rokna --out public/data/rokna-feed.json
        working-directory: backend

      - name: Collect 7sobh tabloid feed for Badbadak
        continue-on-error: true
        run: python -m scripts.collect_7sobh --out public/data/7sobh-feed.json
        working-directory: backend

      - name: Build canonical entity registry
        run: python backend/scripts/build_entities.py --data-dir backend/public/data

      - name: Finalize canonical entity registry
        run: python backend/scripts/finalize_entity_registry.py --registry backend/public/data/entity-registry.json --overrides backend/data/entity-overrides.json --qa-output backend/public/data/entity-qa.json

      - name: Merge all people into canonical registry
        run: python backend/scripts/merge_people.py --data-dir backend/public/data

      - name: Audit creator works against the entire master catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/work-audit-db && mkdir -p /tmp/work-audit-db
          MOVIE_MASTER_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/movie-master.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          test -n "$MOVIE_MASTER_ID"
          gh run download "$MOVIE_MASTER_ID" -n pendar-movie-master-db -D /tmp/work-audit-db
          src="$(find /tmp/work-audit-db -type f -name movie-master.sqlite.gz | head -1)"
          test -n "$src"
          gzip -dc "$src" > /tmp/work-audit-db/master.sqlite
          python backend/tests/test_reconcile_creator_works.py
          python backend/scripts/reconcile_creator_works.py --data-dir backend/public/data --master-db /tmp/work-audit-db/master.sqlite
          python backend/tests/test_link_creator_works.py
          node backend/tests/test_creator_work_links.js
          python backend/scripts/link_creator_works.py --data-dir backend/public/data

      - name: Save creator work reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: creator-work-reconciliation
          path: backend/public/data/creator-work-audit.json
          retention-days: 30

      - name: Verify every canonical person profile is publishable
        run: python backend/scripts/validate_person_profiles.py --data-dir backend/public/data

      - name: Validate Pendar data integrity before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/previous-site
          mkdir -p /tmp/previous-site
          prev_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -n "$prev_id" ]; then
            gh run download "$prev_id" -n latest-static-site -D /tmp/previous-site || true
            python backend/scripts/unpack_site_artifact.py /tmp/previous-site
          fi
          python backend/scripts/validate_site_integrity.py --site backend/public --previous-site /tmp/previous-site

      - name: Validate static SEO routes
        run: |
          python backend/tests/test_seo.py
          node backend/tests/test_seo_routes.js web-static/router.js

      - name: Generate crawlable HTML and sitemaps
        run: python backend/scripts/build_seo.py --site backend/public

      - name: Save the figures published in this build
        uses: actions/upload-artifact@v4
        with:
          name: published-figures
          path: |
            backend/public/data/figures.json
            backend/public/data/stories.json
          if-no-files-found: error
          retention-days: 7
      # Keep a reusable copy of the latest complete static site. The fast UI
      # workflow overlays web-static/ on this artifact instead of rebuilding news.
      - name: Package latest complete site
        run: tar -cf /tmp/latest-static-site.tar -C backend/public .
      - name: Save latest complete site for fast UI deploys
        uses: actions/upload-artifact@v4
        with:
          name: latest-static-site
          path: /tmp/latest-static-site.tar
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Set custom domain
        run: echo 'pendar.io' > backend/public/CNAME
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: backend/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check this build is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Pages deploy: build=$GITHUB_SHA current=$current_sha"
          fi
      - name: Deploy to GitHub Pages
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

  telegram:
    # Use the exact figures artifact that successfully reached GitHub Pages.
    # The workflow's pages concurrency group also serializes delivery/state writes.
    needs: [build, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the deployed figures
        uses: actions/download-artifact@v4
        with:
          name: published-figures
          path: telegram-export
      - name: Publish new figures to Pendario
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: janekalaam_bot
          TELEGRAM_CHAT_ID: "@pendario"
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_RESOLVE_URL: ${{ inputs.resolve_url }}
          TELEGRAM_RESOLUTION: ${{ inputs.resolution }}
        run: python backend/scripts/publish_figures.py --figures telegram-export/figures.json
      - name: Publish periodic digest to Pendario
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: janekalaam_bot
          TELEGRAM_CHAT_ID: "@pendario"
          GH_TOKEN: ${{ github.token }}
        run: python backend/scripts/publish_digest.py --figures telegram-export/figures.json --stories telegram-export/stories.json




