name: Review Future Observatory Evidence
on:
  pull_request:
    paths:
      - 'web-static/data/future-evidence-reviews.json'
      - 'backend/scripts/validate_future_reviews.py'
      - '.github/workflows/future-reviews.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate review ledger schema and provenance history
        run: |
          python backend/scripts/validate_future_reviews.py web-static/data/future-evidence-reviews.json
          git show "${{ github.event.pull_request.base.sha }}:web-static/data/future-evidence-reviews.json" > /tmp/future-base.json
          python backend/scripts/validate_future_reviews.py web-static/data/future-evidence-reviews.json /tmp/future-base.json
