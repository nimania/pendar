name: Triage Simorgh leads for Pendar and Jan Kalam
on:
  workflow_dispatch:
  schedule:
    - cron: "37 */3 * * *"
  push:
    branches: [main]
    paths:
      - "backend/scripts/simorgh_intake.py"
      - "backend/scripts/build_simorgh_briefs.py"
      - "backend/data/simorgh-leads.json"
      - "backend/tests/test_simorgh_intake.py"
      - ".github/workflows/simorgh-intake.yml"
permissions:
  contents: write
concurrency:
  group: pendar-simorgh-intake
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify ingestion and editorial gates offline
        run: python -m unittest backend.tests.test_simorgh_intake -v
      - name: Sync unverified leads; never auto-publish
        run: python backend/scripts/simorgh_intake.py --out backend/data/simorgh-leads.json
      - name: Prepare report assignments from explicitly approved leads
        run: python backend/scripts/build_simorgh_briefs.py
      - name: Commit only changed research leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/simorgh-leads.json backend/data/simorgh-editorial-briefs.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync Simorgh editorial candidate queue"
            git pull --rebase origin main
            git push
          fi
