name: Test Instagram figure ingestion pilot

on:
  pull_request:
    paths:
      - "backend/app/ingestion/instagram_discovery.py"
      - "backend/app/ingestion/service.py"
      - "backend/tests/test_instagram_discovery.py"
      - ".github/workflows/instagram-pilot-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r backend/requirements.txt
      - name: Run offline Instagram tests (no Meta credentials)
        working-directory: backend
        env:
          PENDAR_IG_ALLOWLIST: ""
          PENDAR_IG_USER_ID: ""
          PENDAR_IG_ACCESS_TOKEN: ""
        run: python -m pytest -q tests/test_instagram_discovery.py tests/test_ingestion.py
