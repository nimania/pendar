name: Karname Candidate Intake (editorial review only)

on:
  workflow_dispatch:
  schedule:
    # Every six hours. GitHub scheduled runs can be delayed.
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "backend/data/editorial-recaps.json"
      - "web-static/data/pendar-editorial-views.json"
      - "backend/scripts/collect_karname_candidates.py"
      - "backend/scripts/build_karname_intake_stats.py"
      - "backend/scripts/fetch_karname_figures.py"
      - "backend/tests/test_karname_candidates.py"
      - "backend/tests/test_karname_scenarios.js"
      - "web-static/karname/app.js"
      - ".github/workflows/karname-intake.yml"
  pull_request:
    paths:
      - "backend/scripts/collect_karname_candidates.py"
      - "backend/scripts/build_karname_intake_stats.py"
      - "backend/scripts/fetch_karname_figures.py"
      - "backend/tests/test_karname_candidates.py"
      - "backend/tests/test_karname_scenarios.js"
      - "web-static/karname/app.js"
      - ".github/workflows/karname-intake.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: karname-candidate-intake-main
  cancel-in-progress: false

jobs:
  candidate-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Pendar sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test candidate extraction and safety boundaries
        run: |
          python -m unittest discover -s backend/tests -p 'test_karname_candidates.py' -v
          python -m unittest discover -s backend/tests -p 'test_karname_intake_stats.py' -v
      - name: Verify scenario UI and classifications
        run: |
          node --check web-static/karname/app.js
          node backend/tests/test_karname_scenarios.js
      - name: Read current Pendar figure and news index
        id: figure_feed
        continue-on-error: true
        run: python backend/scripts/fetch_karname_figures.py --output "$RUNNER_TEMP/karname-figures.json"
      - name: Extract candidates across editorial feeds and available figure profiles
        run: |
          if [ -s "$RUNNER_TEMP/karname-figures.json" ]; then
            python backend/scripts/collect_karname_candidates.py --figures "$RUNNER_TEMP/karname-figures.json"
            python backend/scripts/collect_karname_candidates.py --figures "$RUNNER_TEMP/karname-figures.json" --check
          else
            echo "::warning::Figure index unavailable; retaining historical queue and scanning local editorial sources only"
            python backend/scripts/collect_karname_candidates.py
            python backend/scripts/collect_karname_candidates.py --check
          fi
          python backend/scripts/build_karname_intake_stats.py
          python backend/scripts/build_karname_intake_stats.py --check
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path("backend/data/karname-candidates.json").read_text(encoding="utf-8"))
          stats=data["stats"]
          path=Path(os.environ["GITHUB_STEP_SUMMARY"])
          with path.open("a",encoding="utf-8") as f:
              f.write("## Karname editorial intake\n\n")
              f.write(f"- Candidates in review queue: **{stats['total']}**\n")
              f.write(f"- Pending review: **{stats['pending']}**\n")
              f.write(f"- Sources scanned: **{stats['sources_scanned']}**\n")
              f.write(f"- Profiles scanned: **{stats.get('figure_profiles_scanned', 0)}**\n")
              f.write(f"- Figure/news posts scanned: **{stats.get('figure_posts_scanned', 0)}**\n")
              f.write(f"- Figure snapshot available: **{data.get('figure_snapshot_available', False)}**\n")
              f.write("- **No claims or grades were published.**\n")
          PY
      - name: Preserve review queue artifact
        uses: actions/upload-artifact@v4
        with:
          name: karname-candidate-review-queue
          path: backend/data/karname-candidates.json
          if-no-files-found: error
          retention-days: 21
      - name: Save candidate changes and request a fresh Pendar deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add backend/data/karname-candidates.json web-static/karname/intake-stats.json
          if git diff --cached --quiet; then
            echo "No new candidates or review changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(karname): refresh internal claim candidates and public aggregate"
          git pull --rebase origin main
          git push origin HEAD:main
          # A push using GITHUB_TOKEN does not trigger a separate workflow.
          # workflow_dispatch is explicitly allowed by GitHub for this token.
          # Publish only when something changed; unchanged scans stay read-only.
          gh workflow run fast-deploy.yml --ref main
          echo "Triggered Fast Deploy Pendar UI for new aggregate statistics."
