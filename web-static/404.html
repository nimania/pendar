<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحه پیدا نشد | پندار</title><meta name="robots" content="noindex,follow"></head><body><h1>این صفحه پیدا نشد</h1><p>ممکن است نشانی تغییر کرده باشد یا محتوا حذف شده باشد.</p><a href="/">صفحهٔ اول پندار</a><script>
(function(){const hash=location.hash;
if(hash.startsWith("#/")){location.replace("/"+hash.slice(2).replace(/\/$/,"")+"/"+location.search);return;}
const path=location.pathname.replace(/^\/fa(?=\/|$)/,"");
if(path!==location.pathname&&/^\/(story|statement|figure|entity|book|movie|master-movie|books|movies|figures|tv|knowledge)(\/|$)/.test(path))location.replace(path+location.search);
})();
</script></body></html>
