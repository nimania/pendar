<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="کتابخانه عمومی رسپی داینر نیما؛ دستورهای پژوهشی با ذکر منابع آشپزی ایرانی"><title>آزمایشگاه رسپی داینر | پندار</title><style>
*{box-sizing:border-box}body{font:15px/1.9 Tahoma,Arial,sans-serif;background:#f6f3ee;margin:0;color:#27221f}header{background:#241d1a;color:#fff;padding:24px max(18px,calc((100vw - 1100px)/2));border-bottom:4px solid #a62f2b}h1{margin:0;font-size:26px}header p{color:#e1d5ce;margin:4px 0}main{max-width:1100px;margin:24px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.card,.panel{background:white;border:1px solid #e8e0d8;border-radius:12px}.card{padding:14px 20px}.card strong{font-size:24px;display:block}.muted,.card small{color:#79716b}.tabs{display:flex;gap:8px;margin:10px 0}.tabs button,.print{border:1px solid #d6cec5;background:white;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}.tabs button.active{color:white;background:#302622}.search{width:100%;padding:12px;border:1px solid #d6cec5;border-radius:9px;font:inherit;margin:10px 0 14px}.layout{display:grid;grid-template-columns:320px 1fr;gap:16px}.list{overflow:auto;max-height:70vh}.list button{border:0;border-bottom:1px solid #eee;background:white;padding:14px 18px;text-align:right;width:100%;font:inherit;cursor:pointer}.list button:hover,.list button.active{background:#fbefe6}.list small{display:block;color:#837b75}.detail{padding:22px;min-height:430px}h2{margin:0}h3{margin:20px 0 5px}.pill{background:#fdf0da;color:#854c24;padding:3px 10px;border-radius:20px;font-size:12px;display:inline-block}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:right}th{font-size:12px;color:#777}.note{padding:13px;border-radius:8px;background:#faf7f2}.source{padding:15px;border-bottom:1px solid #eee}.source small{display:block;color:#777}.hidden{display:none}footer{max-width:1100px;margin:auto;padding:10px 18px 30px;font-size:12px;color:#777}@media(max-width:700px){.layout{grid-template-columns:1fr}.list{max-height:245px}.card{padding:10px}.card strong{font-size:19px}.detail{padding:16px}}@media print{header,.stats,.tabs,.search,.list,footer,.print{display:none}.layout{display:block}.detail{border:0}}
</style></head><body><header><h1>آزمایشگاه رسپی داینر</h1><p>کتابخانه آشپزی و رسپی‌کارت‌های پژوهشی در پندار</p></header><main><div class="stats"><div class="card"><strong>۱۳</strong><small>منبع ثبت‌شده</small></div><div class="card"><strong>۳</strong><small>رسپی اولیه</small></div><div class="card"><strong>۰</strong><small>رسپی آزموده</small></div></div><nav class="tabs"><button id="tabR" class="active">رسپی‌ها</button><button id="tabS">کتابخانه منابع</button></nav><section id="areaR"><input id="query" class="search" placeholder="جست‌وجوی غذا یا مواد اولیه"><div class="layout"><aside class="panel list" id="list"></aside><article class="panel detail" id="detail"></article></div></section><section id="areaS" class="panel hidden"></section></main><footer>رسپی‌های درج‌شده بازنویسی پژوهشی از منابع نام‌برده‌اند، نه دستورهای آزمایش‌شده در آشپزخانه. حقوق متن و تصویر کتاب‌ها متعلق به صاحبان حقوق آن‌هاست. تصاویر یا PDFهای کتاب‌ها منتشر نشده‌اند.</footer><script type="application/json" id="data">{"sources":[{"id":"S001","title":"کتاب مستطاب آشپزی از سیر تا پیاز، جلد دوم","author":"نجف دریابندری؛ فهیمه راستکار","pages":981},{"id":"S002","title":"سانازسانیا: دایرةالمعارف ابزار و مواد اولیه","author":"ساناز مینایی و همکاران","pages":418},{"id":"S003","title":"هنر آشپزی","author":"رزا منتظمی","pages":842},{"id":"S004","title":"آشپزی کردستان","author":"گروه نویسندگان","pages":594},{"id":"S005","title":"آشپزی دوره صفوی: متن دو رساله","author":"به کوشش ایرج افشار","pages":283},{"id":"S006","title":"آشپزی گیاهی","author":"روحینی قیصری","pages":225},{"id":"S007","title":"مبانی آشپزی","author":"حسن شاهی‌آذر","pages":403},{"id":"S008","title":"آشپزی با مایکروفر","author":"مهری رازی","pages":471},{"id":"S009","title":"ماهنامه آشپزباشی: ویژه شب یلدا","author":"ماهنامه آشپزباشی","pages":22},{"id":"S010","title":"سفره اطعمه","author":"میرزا علی‌اکبرخان آشپزباشی","pages":127},{"id":"S011","title":"آموزش آشپزی غذاهای آماده و فوری","author":"نامشخص","pages":352},{"id":"S012","title":"شربت‌ها از دیدگاه طب ایرانی سنتی","author":"سیدمحمد موسوی","pages":71},{"id":"S013","title":"شربت‌های ایرانی و نوشیدنی‌های سنتی","author":"فاطمه ماهوان","pages":119}],"recipes":[{"name":"خوراک ماهیچه","source":"S001","pages":"صفحات PDF ۱۱ و ۱۲؛ چاپی ۹۹۵ و ۹۹۶","status":"پژوهشی · آزمون‌نشده","ingredients":[["ماهیچه با استخوان","۵۰۰ گرم"],["پیاز","۱ عدد"],["جعفری","۱ دسته"],["زردچوبه","۱ تا ۲ قاشق چای‌خوری"],["نمک و فلفل","به میزان لازم"],["آب","۲ لیتر"]],"method":"ماهیچه با پیاز و جعفری در دو لیتر آب به جوش می‌آید و سپس با حرارت کم پخته می‌شود. حدود سه ساعت بعد، استخوان جدا می‌شود و گوشت همراه با نمک، فلفل و زردچوبه کمی بیشتر می‌پزد تا عصاره کاهش یابد؛ آب گوشت کنار ماهیچه سرو می‌شود.","notes":"زمان پخت، افت وزن، دمای نهایی و بازده در آشپزخانه آزمایش نشده‌اند."},{"name":"دست‌پیچ با سس پرتقال (انگلستان)","source":"S001","pages":"صفحه PDF ۱۲؛ چاپی ۹۹۶","status":"استخراج ناقص · آزمون‌نشده","ingredients":[["سینه گوساله بی‌استخوان","۲ کیلوگرم"],["گرد نان","۱ پیمانه"],["کشمش بی‌دانه","۱ پیمانه"],["مغز گردوی نیم‌کوب","نصف پیمانه"],["تخم‌مرغ سفت خردشده","۲ عدد"],["پیاز رنده‌شده","۱ عدد"],["پرتقال پوست‌گرفته","۲ عدد"],["آرد","۲ قاشق غذاخوری"],["کره","۱ تا ۲ تکه به اندازه گردو"]],"method":"مواد میانی در گوشت قرار می‌گیرند، گوشت پیچیده و پخته می‌شود؛ سس پرتقال جداگانه آماده می‌شود. ادامه دستور هنوز از صفحات بعدی استخراج نشده است.","notes":"دستور ناقص است و برای پخت عملی یا قیمت‌گذاری قابل اتکا نیست."},{"name":"اردور ژامبون اسلامی با اسفناج","source":"S003","pages":"صفحه PDF ۱۷؛ چاپی ۱۹","status":"پژوهشی · آزمون‌نشده","ingredients":[["ورقه ژامبون نازک","۶ ورقه"],["اسفناج","۲ کیلوگرم"],["تخم‌مرغ سفت","۴ عدد"],["سیر","۲ تا ۳ حبه"],["کره","۱۰۰ گرم"],["پیاز خلال‌شده","۳ تا ۴ قاشق غذاخوری"],["آرد گندم","۱ قاشق غذاخوری"],["نمک و فلفل","به میزان لازم"]],"method":"اسفناج شسته و آماده می‌شود و با پیاز، سیر و کره ترکیب می‌شود. بخشی با آرد به‌عنوان پایه سرو استفاده می‌شود و باقی همراه تخم‌مرغ در ورقه‌های ژامبون رول می‌شود. منبع گرم‌کردن کوتاه در فر ملایم را هم مطرح می‌کند.","notes":"زمان و دمای فر، وزن پرس و استاندارد اجرایی هنوز مشخص و آزموده نشده‌اند."}]}</script><script>
const db=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let selected=0;const source=id=>db.sources.find(x=>x.id===id)?.title||id;
function e(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=String(text);if(cls)x.className=cls;return x}
function renderList(){const q=$('query').value.trim();$('list').replaceChildren();db.recipes.forEach((r,i)=>{if(q&&![r.name,r.method,source(r.source),...r.ingredients.map(z=>z[0])].join(' ').includes(q))return;const b=e('button');if(i===selected)b.className='active';b.append(e('b',r.name),e('small',source(r.source)));b.onclick=()=>show(i);$('list').append(b)});if(!$('list').children.length)$('list').append(e('div','موردی پیدا نشد.','source'))}
function show(i){selected=i;const r=db.recipes[i],node=$('detail');node.replaceChildren();node.append(e('span',r.status,'pill'),e('h2',r.name),e('p',source(r.source)+' · '+r.pages,'muted'),e('h3','مواد اولیه'));const t=e('table'),body=e('tbody');r.ingredients.forEach(ing=>{const row=e('tr');row.append(e('td',ing[0]),e('td',ing[1]));body.append(row)});t.append(body);node.append(t,e('h3','خلاصه دستور پخت'),e('p',r.method),e('h3','یادداشت پژوهشی'),e('p',r.notes,'note'));const btn=e('button','چاپ رسپی‌کارت','print');btn.onclick=()=>window.print();node.append(btn);renderList()}
$('query').oninput=renderList;$('tabR').onclick=()=>{$('areaR').classList.remove('hidden');$('areaS').classList.add('hidden');$('tabR').classList.add('active');$('tabS').classList.remove('active')};$('tabS').onclick=()=>{$('areaS').classList.remove('hidden');$('areaR').classList.add('hidden');$('tabS').classList.add('active');$('tabR').classList.remove('active')};db.sources.forEach(s=>{$('areaS').append(e('div',s.title+' — '+s.author+' · '+s.pages.toLocaleString('fa-IR')+' صفحه','source'))});show(0);
</script></body></html>
